<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Customer Records</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #f6f1e6;
            --card: #fff;
            --line: #eadfc7;
            --ink: #202020;
            --muted: #6a6a6a;
            --accent: #f2c24d;
            --danger: #c33f3f;
            --ok: #2c8a56;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Segoe UI, sans-serif; color: var(--ink); background: linear-gradient(180deg, #fbf7ee 0%, var(--bg) 60%); }
        .topbar {
            position: sticky; top: 0; z-index: 20;
            background: rgba(30,30,30,0.92); color: #fff;
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 20px;
        }
        .topbar a { color: #fff; text-decoration: none; font-size: 13px; font-weight: 700; border: 1px solid rgba(255,255,255,0.22); padding: 7px 11px; border-radius: 18px; }
        .top-links { display: flex; gap: 8px; align-items: center; }
        .pill { background: #fff; color: #222; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; }

        .wrap { max-width: 1180px; margin: 18px auto 34px; padding: 0 16px; }
        .panel {
            background: var(--card); border: 1px solid var(--line); border-radius: 14px;
            box-shadow: 0 8px 20px rgba(70, 55, 24, 0.08);
            overflow: hidden;
        }
        .panel-head {
            display: flex; justify-content: space-between; align-items: center;
            gap: 10px; padding: 14px; border-bottom: 1px solid var(--line);
            background: #fffaf0;
        }
        .filters { display: flex; gap: 8px; flex-wrap: wrap; }
        .filters input, .filters select {
            border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font-size: 13px;
        }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 10px; border-top: 1px solid #f1ead8; font-size: 13px; text-align: left; vertical-align: middle; }
        th { border-top: none; background: #fffdf7; color: #6f685b; text-transform: uppercase; letter-spacing: 0.04em; font-size: 11px; }

        .status { display: inline-block; border-radius: 12px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
        .status.active { background: #e7f8ef; color: var(--ok); }
        .status.suspended { background: #fdeaea; color: #9f2222; }
        .status.shadow { background: #ede8ff; color: #5542a5; }
        .status.pending { background: #fff4d6; color: #8a6d1a; }
        .status.approved { background: #e7f8ef; color: var(--ok); }
        .status.rejected { background: #fdeaea; color: #9f2222; }
        .status.none { background: #f1ead8; color: var(--muted); }
        .btn.approve { border-color: var(--ok); color: var(--ok); }
        .btn.reject { border-color: var(--danger); color: var(--danger); }
        .view-id-link { display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 700; color: #8a6d1a; }

        .actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn {
            border: 1px solid #1e1e1e; border-radius: 7px; background: #fff;
            padding: 7px 10px; font-size: 12px; font-weight: 700; cursor: pointer;
        }
        .btn.warn { border-color: var(--danger); color: var(--danger); }
        .btn.ok { border-color: var(--ok); color: var(--ok); }
        .btn.shadow { border-color: #5542a5; color: #5542a5; }

        .empty { padding: 28px; text-align: center; color: var(--muted); }
    </style>
</head>
<body>
    <header class="topbar">
        <div style="font-weight: 800; letter-spacing: 0.06em;">ADMIN PORTAL</div>
        <div class="top-links">
            <span id="adminName" class="pill">Admin</span>
            <a href="admin.html">Dashboard</a>
            <a href="adminseller.html">Seller Approvals</a>
            <a href="admincustomers.html">Customer Records</a>
            <a href="adminauditlogs.html">Audit Logs</a>
            <a href="#" onclick="logout();return false;">Logout</a>
        </div>
    </header>

    <main class="wrap">
        <h1 style="margin: 4px 0 6px;">Customer Records Management</h1>
        <p style="margin: 0 0 14px; color: var(--muted);">Suspend/reactivate accounts, apply shadow ban actions, and review PWD/Senior ID applications.</p>

        <section class="panel">
            <div class="panel-head">
                <strong><i class="fa-solid fa-users"></i> Managed Accounts</strong>
                <div class="filters">
                    <input id="searchInput" type="text" placeholder="Search name or email">
                    <select id="roleFilter">
                        <option value="">All roles</option>
                        <option value="buyer">Customers only</option>
                        <option value="seller">Sellers only</option>
                    </select>
                </div>
            </div>

            <div style="overflow:auto;">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Account</th>
                            <th>Shadow Ban</th>
                            <th>PWD/Senior</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userRows">
                        <tr><td colspan="8" class="empty">Loading accounts...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const token = sessionStorage.getItem('authToken');
        const role = (sessionStorage.getItem('currentUserRole') || '').toLowerCase();
        const name = sessionStorage.getItem('currentUserFullName') || 'Administrator';

        if (!token || role !== 'admin') {
            alert('Admin access required.');
            window.location.href = './login.html';
        }
        document.getElementById('adminName').textContent = name;

        function authHeader() {
            return { 'Authorization': 'Bearer ' + token };
        }

        function logout() {
            sessionStorage.removeItem('pendingRedirect');
            sessionStorage.clear();
            window.location.replace('./login.html?loggedOut=1');
        }

        let allUsers = [];

        function rowStatusLabel(user) {
            const active = user.isActive !== false;
            return '<span class="status ' + (active ? 'active' : 'suspended') + '">' + (active ? 'Active' : 'Suspended') + '</span>';
        }

        function shadowLabel(user) {
            const shadow = user.isShadowBanned === true;
            return '<span class="status ' + (shadow ? 'shadow' : 'active') + '">' + (shadow ? 'Shadow Banned' : 'Normal') + '</span>';
        }

        function discountCell(user) {
            const discountType = user.discountType;
            if (!discountType || discountType === 'NONE') {
                return '<span class="status none">&mdash;</span>';
            }
            if (!user.discountIdImageUrl) {
                return '<span class="status none">' + discountType + ' &middot; No ID submitted</span>';
            }
            const status = user.discountStatus || 'PENDING';
            const statusClass = status.toLowerCase();
            const label = discountType + ' &middot; ' + status.charAt(0) + status.slice(1).toLowerCase();
            let html = '<span class="status ' + statusClass + '">' + label + '</span>';
            html += '<br><a class="view-id-link" href="' + user.discountIdImageUrl + '" target="_blank" rel="noopener">View ID</a>';
            return html;
        }

        function renderRows(users) {
            const tbody = document.getElementById('userRows');
            if (!users || users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="empty">No matching accounts found.</td></tr>';
                return;
            }

            tbody.innerHTML = users.map(user => {
                const active = user.isActive !== false;
                const shadow = user.isShadowBanned === true;
                const roleText = (user.role || '').toString().toUpperCase();
                const discountPending = user.discountStatus === 'PENDING';
                return '<tr>' +
                    '<td>' + user.userId + '</td>' +
                    '<td>' + (user.fullName || '-') + '</td>' +
                    '<td>' + (user.email || '-') + '</td>' +
                    '<td>' + roleText + '</td>' +
                    '<td>' + rowStatusLabel(user) + '</td>' +
                    '<td>' + shadowLabel(user) + '</td>' +
                    '<td>' + discountCell(user) + '</td>' +
                    '<td>' +
                        '<div class="actions">' +
                            (active
                                ? '<button class="btn warn" onclick="toggleStatus(' + user.userId + ', false)">Suspend</button>'
                                : '<button class="btn ok" onclick="toggleStatus(' + user.userId + ', true)">Reactivate</button>') +
                            (shadow
                                ? '<button class="btn" onclick="toggleShadow(' + user.userId + ', false)">Remove Shadow Ban</button>'
                                : '<button class="btn shadow" onclick="toggleShadow(' + user.userId + ', true)">Shadow Ban</button>') +
                            (discountPending
                                ? '<button class="btn approve" onclick="decideDiscount(' + user.userId + ', \'APPROVED\')">Approve ID</button>' +
                                  '<button class="btn reject" onclick="decideDiscount(' + user.userId + ', \'REJECTED\')">Reject ID</button>'
                                : '') +
                        '</div>' +
                    '</td>' +
                '</tr>';
            }).join('');
        }

        function applyClientFilter() {
            const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
            const filtered = allUsers.filter(u => {
                const nameMatch = (u.fullName || '').toLowerCase().includes(q);
                const emailMatch = (u.email || '').toLowerCase().includes(q);
                return !q || nameMatch || emailMatch;
            });
            renderRows(filtered);
        }

        async function fetchUsers() {
            const roleFilter = document.getElementById('roleFilter').value;
            const url = roleFilter ? '/api/admin/users?role=' + encodeURIComponent(roleFilter) : '/api/admin/users';
            const res = await fetch(url, { headers: authHeader() });
            if (!res.ok) throw new Error('Failed to load users');
            allUsers = await res.json();
            applyClientFilter();
        }

        async function toggleStatus(userId, isActive) {
            if (!confirm('Confirm account status change?')) return;
            const url = '/api/admin/users/' + userId + '/status?isActive=' + isActive;
            const res = await fetch(url, { method: 'PUT', headers: authHeader() });
            if (!res.ok) {
                alert('Failed to update account status.');
                return;
            }
            await fetchUsers();
        }

        async function toggleShadow(userId, shadowBanned) {
            if (!confirm('Confirm shadow ban action?')) return;
            const url = '/api/admin/users/' + userId + '/shadow-ban?shadowBanned=' + shadowBanned;
            const res = await fetch(url, { method: 'PUT', headers: authHeader() });
            if (!res.ok) {
                alert('Failed to update shadow ban state.');
                return;
            }
            await fetchUsers();
        }

        async function decideDiscount(userId, status) {
            if (!confirm('Confirm ' + status.toLowerCase() + ' of this PWD/Senior ID application?')) return;
            const url = '/api/admin/users/' + userId + '/discount-status?status=' + status;
            const res = await fetch(url, { method: 'PUT', headers: authHeader() });
            if (!res.ok) {
                alert('Failed to update discount application status.');
                return;
            }
            await fetchUsers();
        }

        document.getElementById('searchInput').addEventListener('input', applyClientFilter);
        document.getElementById('roleFilter').addEventListener('change', fetchUsers);

        fetchUsers().catch(() => {
            document.getElementById('userRows').innerHTML = '<tr><td colspan="8" class="empty">Could not load users.</td></tr>';
        });
    </script>
</body>
</html>
