<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management - Seller Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Shared Dashboard Styles */
        body { font-family: 'Inter', sans-serif; margin: 0; padding-top: 110px; background-color: #faf9ee; color: #333; }
        * { box-sizing: border-box; }
        
        .dashboard-container { max-width: 1400px; margin: 0 auto; padding: 20px 40px; display: flex; gap: 40px; }
        .card { background: white; border: 1px solid #e5e5e5; border-radius: 8px; padding: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        /* Sidebar Navigation */
        .sidebar { flex: 0 0 220px; display: flex; flex-direction: column; gap: 10px; position: sticky; top: 130px; height: fit-content; }
        .nav-item { display: flex; align-items: center; gap: 15px; padding: 12px 20px; font-size: 16px; font-weight: 600; color: #555; text-decoration: none; border-radius: 8px; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background-color: #e5e5e5; color: #000; }
        .nav-item i { font-size: 18px; width: 24px; text-align: center; }

        /* Inventory-specific Styles */
        .main-content { flex: 1; display: flex; flex-direction: column; gap: 30px; }
        .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .stat-card { display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .stat-value { font-size: 28px; font-weight: 700; margin: 5px 0; }
        .stat-label { font-size: 11px; font-weight: 700; color: #666; text-transform: uppercase; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; font-size: 12px; color: #888; padding: 15px; border-bottom: 2px solid #eee; text-transform: uppercase; }
        td { padding: 15px; border-top: 1px solid #eee; font-size: 14px; }
        .status-pill { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; }
        .status-active { background: #e8f5e9; color: #2e7d32; }
        .status-archived { background: #ffebee; color: #c62828; }
        .edit-button { background: none; border: 1px solid #ccc; padding: 5px 10px; cursor: pointer; border-radius: 4px; }
        .edit-button:hover { background: #eee; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); z-index: 10000; justify-content: center; align-items: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; border-radius: 16px; max-width: 420px; width: 100%; padding: 28px 24px; box-shadow: 0 18px 50px rgba(0,0,0,0.18); }
        .modal h3 { margin-top: 0; margin-bottom: 18px; font-size: 22px; }
        .modal .form-row { display: grid; gap: 16px; margin-bottom: 18px; }
        .modal label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #444; }
        .modal select, .modal input { width: 100%; padding: 12px 14px; border: 1px solid #d7d7d7; border-radius: 10px; font-size: 14px; color: #222; }
        .modal .button-row { display: flex; justify-content: flex-end; gap: 12px; margin-top: 8px; }
        .modal .btn { border: none; border-radius: 10px; padding: 12px 18px; cursor: pointer; font-weight: 700; }
        .modal .btn-secondary { background: #f2f2f2; color: #333; }
        .modal .btn-primary { background: #2145a3; color: white; }
        .modal .btn-primary:hover, .modal .btn-secondary:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <header style="background-color: rgba(36, 36, 36, 0.50); backdrop-filter: blur(8px); position: fixed; top: 0; left: 0; width: 100%; height: 90px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; z-index: 9999;">
        <div style="display: flex; align-items: center; gap: 30px;">
            <img src="/images/logo.png" style="height: 36px; width: auto;" alt="Logo">
        </div>
        <div style="display: flex; align-items: center; gap: 24px;">
            <a href="homepage.html" style="color:white; font-size:20px; text-decoration:none;"><i class="fa-solid fa-house"></i></a>
            <a href="shoppingcart.html" style="color:white; font-size:20px; text-decoration:none;"><i class="fa-solid fa-bag-shopping"></i></a>
        </div>
    </header>

    <div class="dashboard-container">
        <aside class="sidebar">
            <a href="sellerhomeprofile.html" class="nav-item"><i class="fa-solid fa-house"></i> Home</a>
            <a href="#" class="nav-item active"><i class="fa-solid fa-box"></i> Inventory</a>
            <a href="revenue.html" class="nav-item"><i class="fa-solid fa-chart-simple"></i> Analytics</a>
        </aside>

        <main class="main-content">
            <div class="metrics-grid">
                <div class="card stat-card"><div class="stat-label">TOTAL ITEMS</div><div class="stat-value">8</div></div>
                <div class="card stat-card"><div class="stat-label">AVAILABLE</div><div class="stat-value">6</div></div>
                <div class="card stat-card"><div class="stat-label">SOLD</div><div class="stat-value">13</div></div>
                <div class="card stat-card"><div class="stat-label">ARCHIVED</div><div class="stat-value">2</div></div>
            </div>

            <section class="card">
                <h2>INVENTORY LIST</h2>
                <table>
                    <thead>
                        <tr><th>Product</th><th>Category</th><th>Size</th><th>Status</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="inventoryTableBody">
                        <tr><td colspan="5">Loading inventory...</td></tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <div id="editModalOverlay" class="modal-overlay" aria-hidden="true">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
            <h3 id="editModalTitle">Edit Inventory Item</h3>
            <div class="form-row">
                <label for="editProductName">Product</label>
                <input id="editProductName" type="text" readonly />
            </div>
            <div class="form-row">
                <label for="editCategory">Category</label>
                <select id="editCategory">
                    <option>Top</option>
                    <option>Bottom</option>
                    <option>Outerwear</option>
                    <option>Accessories</option>
                </select>
            </div>
            <div class="form-row">
                <label for="editSize">Size</label>
                <select id="editSize">
                    <option>XS</option>
                    <option>S</option>
                    <option>M</option>
                    <option>L</option>
                    <option>XL</option>
                </select>
            </div>
            <div class="form-row">
                <label for="editStatus">Status</label>
                <select id="editStatus">
                    <option value="AVAILABLE">Active</option>
                    <option value="ARCHIVED">Archived</option>
                </select>
            </div>
            <div class="button-row">
                <button type="button" class="btn btn-secondary" id="cancelEditButton">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveEditButton">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        const editModalOverlay = document.getElementById('editModalOverlay');
        const editProductName = document.getElementById('editProductName');
        const editCategory = document.getElementById('editCategory');
        const editSize = document.getElementById('editSize');
        const editStatus = document.getElementById('editStatus');
        const saveEditButton = document.getElementById('saveEditButton');
        const cancelEditButton = document.getElementById('cancelEditButton');
        const inventoryTableBody = document.getElementById('inventoryTableBody');
        let activeRow = null;
        let activeProductId = null;

        function mapDisplayStatus(status) {
            if (status === 'AVAILABLE') return 'Active';
            if (status === 'ARCHIVED') return 'Archived';
            return status || '';
        }

        function buildStatusClass(status) {
            if (status === 'AVAILABLE') return 'status-active';
            if (status === 'ARCHIVED') return 'status-archived';
            return '';
        }

        function attachInventoryEvents() {
            inventoryTableBody.addEventListener('click', event => {
                if (event.target.matches('.edit-button')) {
                    const row = event.target.closest('tr');
                    if (row) {
                        openEditModal(row);
                    }
                }
            });
        }

        function openEditModal(row) {
            activeRow = row;
            activeProductId = row.dataset.productId;
            editProductName.value = row.dataset.productName || '';
            editCategory.value = row.dataset.productCategory || '';
            editSize.value = row.dataset.productSize || '';
            editStatus.value = row.dataset.productStatus || 'AVAILABLE';
            editModalOverlay.classList.add('active');
            editModalOverlay.setAttribute('aria-hidden', 'false');
        }

        function closeEditModal() {
            activeRow = null;
            activeProductId = null;
            editModalOverlay.classList.remove('active');
            editModalOverlay.setAttribute('aria-hidden', 'true');
        }

        async function loadInventory() {
            inventoryTableBody.innerHTML = '<tr><td colspan="5">Loading inventory...</td></tr>';
            try {
                const response = await fetch('/api/products/admin');
                if (!response.ok) {
                    throw new Error('Unable to load products from server');
                }
                const products = await response.json();
                if (!Array.isArray(products) || products.length === 0) {
                    inventoryTableBody.innerHTML = '<tr><td colspan="5">No inventory items found.</td></tr>';
                    return;
                }

                inventoryTableBody.innerHTML = products.map(product => {
                    const statusClass = buildStatusClass(product.status);
                    const displayStatus = mapDisplayStatus(product.status);
                    return `
                        <tr data-product-id="${product.productId || ''}" data-product-name="${product.itemName || ''}" data-product-category="${product.category || ''}" data-product-size="${product.size || ''}" data-product-status="${product.status || 'AVAILABLE'}">
                            <td>${product.itemName || ''}</td>
                            <td>${product.category || ''}</td>
                            <td>${product.size || ''}</td>
                            <td><span class="status-pill ${statusClass}">${displayStatus}</span></td>
                            <td><button class="edit-button">Edit</button></td>
                        </tr>`;
                }).join('');
            } catch (error) {
                inventoryTableBody.innerHTML = '<tr><td colspan="5">Failed to load inventory.</td></tr>';
                console.error(error);
            }
        }

        saveEditButton.addEventListener('click', async () => {
            if (!activeRow || !activeProductId) return;

            const payload = {
                category: editCategory.value,
                size: editSize.value,
                status: editStatus.value
            };

            try {
                const response = await fetch('/api/products/' + activeProductId, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) {
                    throw new Error('Failed to save item changes');
                }
                const updatedProduct = await response.json();
                activeRow.dataset.productCategory = updatedProduct.category || editCategory.value;
                activeRow.dataset.productSize = updatedProduct.size || editSize.value;
                activeRow.dataset.productStatus = updatedProduct.status || editStatus.value;
                activeRow.querySelectorAll('td')[1].textContent = updatedProduct.category || editCategory.value;
                activeRow.querySelectorAll('td')[2].textContent = updatedProduct.size || editSize.value;
                activeRow.querySelectorAll('td')[3].innerHTML = `<span class="status-pill ${buildStatusClass(updatedProduct.status)}">${mapDisplayStatus(updatedProduct.status)}</span>`;
                closeEditModal();
            } catch (error) {
                alert('Unable to save inventory changes.');
                console.error(error);
            }
        });

        cancelEditButton.addEventListener('click', closeEditModal);
        editModalOverlay.addEventListener('click', event => {
            if (event.target === editModalOverlay) {
                closeEditModal();
            }
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && editModalOverlay.classList.contains('active')) {
                closeEditModal();
            }
        });

        attachInventoryEvents();
        loadInventory();
    </script>
</body>
</html>
