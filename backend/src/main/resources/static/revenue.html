<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics & Revenue - Seller Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Shared Dashboard Styles */
        body { font-family: 'Inter', sans-serif; margin: 0; padding-top: 110px; background-color: #faf9ee; color: #333; }
        * { box-sizing: border-box; }
        
        /* UNIFORM NAVBAR */
        header { background-color: rgba(36, 36, 36, 0.50); backdrop-filter: blur(8px); position: fixed; top: 0; left: 0; width: 100%; height: 90px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; z-index: 9999; }
        
        .dashboard-container { max-width: 1400px; margin: 0 auto; padding: 20px 40px; display: flex; gap: 40px; }
        .card { background: white; border: 1px solid #e5e5e5; border-radius: 8px; padding: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        /* Sidebar Navigation */
        .sidebar { flex: 0 0 220px; display: flex; flex-direction: column; gap: 10px; position: sticky; top: 130px; height: fit-content; }
        .nav-item { display: flex; align-items: center; gap: 15px; padding: 12px 20px; font-size: 16px; font-weight: 600; color: #555; text-decoration: none; border-radius: 8px; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background-color: #e5e5e5; color: #000; }
        .nav-item i { font-size: 18px; width: 24px; text-align: center; }

        /* Main Content Area */
        .main-content { flex: 1; display: flex; flex-direction: column; gap: 30px; }
        
        /* Metrics Grid */
        .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .metric-card { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 25px 15px; }
        .metric-card i { font-size: 24px; margin-bottom: 12px; }
        .metric-value { font-size: 28px; font-weight: 700; color: #000; margin-bottom: 5px; }
        .metric-label { font-size: 11px; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: 0.05em; }

        /* Chart Placeholder */
        .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .chart-header h2 { margin: 0; font-size: 18px; font-weight: 700; }
        .chart-area { height: 300px; background: #fcfcfc; border: 1px dashed #ddd; border-radius: 8px; display: flex; align-items: flex-end; justify-content: space-around; padding: 20px 10px 0; }
        .chart-bar { width: 50px; background-color: #e5e5e5; border-top-left-radius: 4px; border-top-right-radius: 4px; transition: 0.3s; }
        .chart-bar:hover { background-color: #fbce60; }
        .chart-bar.active { background-color: #fbce60; }
        .x-axis { display: flex; justify-content: space-around; margin-top: 15px; font-size: 12px; color: #888; font-weight: 600; text-transform: uppercase; }

        /* Table Styles */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; font-size: 12px; color: #888; padding: 15px; border-bottom: 2px solid #eee; text-transform: uppercase; }
        td { padding: 15px; border-top: 1px solid #eee; font-size: 14px; color: #333; }
        .row-total { background-color: #faf9ee; font-weight: 700; border-top: 2px solid #ddd; }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; align-items: center; gap: 30px;">
            <img src="/images/logo.png" style="height: 36px; width: auto;" alt="Logo">
        </div>
        <div style="display: flex; align-items: center; gap: 24px;">
            <div style="display: flex; background-color: rgba(255,255,255,0.2); padding: 3px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.3); backdrop-filter: blur(8px);">
                <button style="background: none; color: rgba(255,255,255,0.7); border: none; padding: 6px 20px; font-size: 11px; font-weight: 800; border-radius: 20px; cursor: pointer;">BUY</button>
                <button onclick="if (!(window.handleSellEntryAction && window.handleSellEntryAction(event))) { const r=(sessionStorage.getItem('currentUserRole')||'').toLowerCase(); const a=sessionStorage.getItem('currentUserSellerApproved')==='true'; const v=(sessionStorage.getItem('currentUserVerificationStatus')||'').toUpperCase(); if (r==='admin') { window.location.href='./admin.html'; } else if (r==='seller' || (a && v==='APPROVED')) { window.location.href='./sellerhomeprofile.html'; } else { window.location.href='./sellerregistration.html'; } }" style="background-color: #ffffff; color: #000000; border: none; padding: 6px 20px; font-size: 11px; font-weight: 800; border-radius: 20px; cursor: pointer;">SELL</button>
            </div>
            
            <a href="homepage.html" style="color:white; font-size:20px; text-decoration:none;"><i class="fa-solid fa-house"></i></a>
            <a href="shoppingcart.html" style="color:white; font-size:20px; text-decoration:none;"><i class="fa-solid fa-bag-shopping"></i></a>
        </div>
    </header>

    <div class="dashboard-container">
        
        <aside class="sidebar">
            <a href="sellerhomeprofile.html" class="nav-item"><i class="fa-solid fa-house"></i> Home</a>
            <a href="inventorymanagement.html" class="nav-item"><i class="fa-solid fa-box"></i> Inventory</a>
            <a href="#" class="nav-item active"><i class="fa-solid fa-chart-simple"></i> Analytics</a>
        </aside>

        <main class="main-content">
            
            <div class="metrics-grid">
                <div class="card metric-card">
                    <i class="fa-solid fa-peso-sign" style="color: #fbce60;"></i>
                    <div class="metric-value" id="metricRevenue">₱0</div>
                    <div class="metric-label">Revenue This Month</div>
                </div>
                <div class="card metric-card">
                    <i class="fa-solid fa-bag-shopping" style="color: #4CAF50;"></i>
                    <div class="metric-value" id="metricSold">0</div>
                    <div class="metric-label">Items Sold</div>
                </div>
                <div class="card metric-card">
                    <i class="fa-solid fa-tag" style="color: #2196F3;"></i>
                    <div class="metric-value" id="metricAverage">₱0</div>
                    <div class="metric-label">Average Sale Price</div>
                </div>
                <div class="card metric-card">
                    <i class="fa-regular fa-eye" style="color: #9C27B0;"></i>
                    <div class="metric-value" id="metricViews">0</div>
                    <div class="metric-label">Total Product Views</div>
                </div>
            </div>

            <section class="card">
                <div class="chart-header">
                    <h2>SALES OVERVIEW</h2>
                    <select style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; outline: none; cursor: pointer;">
                        <option>2026</option>
                    </select>
                </div>
                
                <div class="chart-area" id="analyticsChartArea" style="align-items:center; justify-content:center; color:#777; font-size:13px;">No sales data yet.</div>
                <div class="x-axis" id="analyticsXAxis"></div>
            </section>

            <section class="card">
                <h2 style="margin: 0 0 10px 0; font-size: 18px; font-weight: 700;">CATEGORY REVENUE DATA</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Category</th>
                            <th>Items Sold</th>
                            <th>Revenue Generated</th>
                            <th>% of Total Revenue</th>
                        </tr>
                    </thead>
                    <tbody id="categoryRevenueBody">
                        <tr>
                            <td colspan="4">No category sales data yet.</td>
                        </tr>
                    </tbody>
                </table>
            </section>

        </main>
    </div>

    <script>
        const currentUserId = sessionStorage.getItem('currentUserId');
        const authToken = sessionStorage.getItem('authToken');

        function authHeaders() {
            return authToken ? { 'Authorization': 'Bearer ' + authToken } : {};
        }

        function formatCurrency(value) {
            const amount = Number(value || 0);
            return `₱${Number.isFinite(amount) ? amount.toFixed(0) : '0'}`;
        }

        async function ensureSellerAccess() {
            if (!currentUserId) {
                window.location.href = './login.html?next=./sellerhomeprofile.html';
                return false;
            }

            try {
                const response = await fetch(`/api/profile/${encodeURIComponent(currentUserId)}`, { headers: authHeaders() });
                if (!response.ok) {
                    window.location.href = './login.html?next=./sellerregistration.html';
                    return false;
                }
                const profile = await response.json();
                const approved = profile?.sellerApproved === true;
                const verification = (profile?.verificationStatus || '').toUpperCase();
                sessionStorage.setItem('currentUserSellerApproved', approved ? 'true' : 'false');
                sessionStorage.setItem('currentUserVerificationStatus', verification);
                if (!approved || verification !== 'APPROVED') {
                    window.location.href = './sellerregistration.html';
                    return false;
                }
                return true;
            } catch (error) {
                console.error(error);
                window.location.href = './sellerregistration.html';
                return false;
            }
        }

        function renderCategoryTable(products) {
            const body = document.getElementById('categoryRevenueBody');
            if (!Array.isArray(products) || products.length === 0) {
                body.innerHTML = '<tr><td colspan="4">No category sales data yet.</td></tr>';
                return;
            }

            const byCategory = new Map();
            products.forEach(product => {
                const category = (product.category || 'Uncategorized').trim() || 'Uncategorized';
                const price = Number(product.price) || 0;
                const current = byCategory.get(category) || { count: 0, value: 0 };
                current.count += 1;
                current.value += price;
                byCategory.set(category, current);
            });

            const rows = Array.from(byCategory.entries());
            const totalValue = rows.reduce((sum, entry) => sum + entry[1].value, 0);
            const totalCount = rows.reduce((sum, entry) => sum + entry[1].count, 0);

            body.innerHTML = rows.map(([category, info]) => {
                const percent = totalValue > 0 ? ((info.value / totalValue) * 100).toFixed(1) : '0.0';
                return `
                    <tr>
                        <td>${category}</td>
                        <td>${info.count}</td>
                        <td>${formatCurrency(info.value)}</td>
                        <td>${percent}%</td>
                    </tr>
                `;
            }).join('') + `
                <tr class="row-total">
                    <td>Total</td>
                    <td>${totalCount}</td>
                    <td>${formatCurrency(totalValue)}</td>
                    <td>100%</td>
                </tr>
            `;
        }

        function renderChart(products) {
            const chartArea = document.getElementById('analyticsChartArea');
            const xAxis = document.getElementById('analyticsXAxis');

            const safeProducts = Array.isArray(products) ? products : [];
            const byStatus = (status) => safeProducts.filter(item => (item.status || '').toUpperCase() === status).length;
            const series = [
                { label: 'Available', value: byStatus('AVAILABLE') },
                { label: 'Draft', value: byStatus('DRAFT') },
                { label: 'Archived', value: byStatus('ARCHIVED') },
                { label: 'Sold', value: byStatus('SOLD') },
                { label: 'Flagged', value: byStatus('FLAGGED') },
                { label: 'Total', value: safeProducts.length }
            ];

            const max = Math.max(...series.map(item => item.value), 0);
            if (max === 0) {
                chartArea.style.alignItems = 'center';
                chartArea.style.justifyContent = 'center';
                chartArea.innerHTML = 'No sales data yet.';
                xAxis.innerHTML = '';
                return;
            }

            chartArea.style.alignItems = 'flex-end';
            chartArea.style.justifyContent = 'space-around';
            chartArea.innerHTML = series.map((item, index) => {
                const height = Math.max(8, (item.value / max) * 100);
                const activeClass = index === series.length - 1 ? 'active' : '';
                return `<div class="chart-bar ${activeClass}" style="height:${height}%;" title="${item.value}"></div>`;
            }).join('');
            xAxis.innerHTML = series.map(item => `<span>${item.label}</span>`).join('');
        }

        async function loadAnalytics() {
            const productsResponse = await fetch(`/api/products/seller/${encodeURIComponent(currentUserId)}`, { headers: authHeaders() });
            const products = productsResponse.ok ? await productsResponse.json() : [];

            const sold = Array.isArray(products)
                ? products.filter(product => (product.status || '').toUpperCase() === 'SOLD').length
                : 0;
            const revenue = 0;
            const average = sold > 0 ? revenue / sold : 0;

            document.getElementById('metricRevenue').textContent = formatCurrency(revenue);
            document.getElementById('metricSold').textContent = String(sold);
            document.getElementById('metricAverage').textContent = formatCurrency(average);
            document.getElementById('metricViews').textContent = '0';

            renderChart(products);
            renderCategoryTable(products);
        }

        ensureSellerAccess().then((allowed) => {
            if (allowed) {
                loadAnalytics().catch((error) => {
                    console.error('Unable to load analytics:', error);
                });
            }
        });
    </script>

</body>
</html>
