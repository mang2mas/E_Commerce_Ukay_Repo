<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Registration</title>
    <!-- FontAwesome for Navbar Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Reset & General Styles */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f6f5ef; color: #333; padding-top: 90px; }

        /* UNIFORM NAVBAR */
        header { background-color: rgba(36, 36, 36, 0.50); backdrop-filter: blur(8px); position: fixed; top: 0; left: 0; width: 100%; height: 90px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; z-index: 9999; }
        
        /* Main Form Container */
        .main-container {
            width: 90%; max-width: 1000px; margin: 40px auto; background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-radius: 8px; overflow: hidden;
        }

        /* Tabs */
        .tabs { display: flex; border-bottom: 1px solid #eee; }
        .tab {
            flex: 1; text-align: center; padding: 20px; font-size: 18px; color: #888;
            background-color: #f3f3f3; cursor: pointer; text-decoration: none;
        }
        .tab.active { background-color: white; font-weight: bold; color: #111; cursor: default; border-top-left-radius: 20px; }

        /* Form Layout */
        .form-content { display: flex; padding: 50px; gap: 50px; }
        .left-column { flex: 0 0 250px; }
        .right-column { flex: 1; }
        
        .upload-box {
            width: 250px; height: 250px; border: 2px dashed #ccc; display: flex; align-items: center;
            justify-content: center; text-align: center; font-size: 14px; color: #999;
            background-color: #fafafa; cursor: pointer; padding: 20px; border-radius: 8px;
            background-size: cover; background-position: center; background-repeat: no-repeat;
        }

        .section-title { font-size: 18px; font-weight: bold; margin-bottom: 20px; margin-top: 40px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .section-title:first-child { margin-top: 0; }

        /* Grid for Inputs */
        .input-group {
            display: grid; grid-template-columns: 160px 1fr; align-items: start;
            margin-bottom: 20px; font-size: 14px;
        }
        .input-group label { padding-top: 10px; color: #333; font-weight: 600; }
        input[type="text"], input[type="email"], input[type="tel"], textarea {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px;
            font-size: 14px; outline: none; transition: border-color 0.2s;
        }
        input:focus, textarea:focus { border-color: #aaa; }
        textarea { height: 120px; resize: vertical; }

        .verification-row { display: flex; gap: 12px; justify-content: flex-end; margin-left: 160px; }
        .verification-row input { background-color: #f9f9f9; text-align: center; color: #888; }
        .btn-send { padding: 12px 20px; border: 1px solid #ddd; background: white; cursor: pointer; font-size: 14px; border-radius: 4px; }
        .btn-send:hover { background-color: #f3f3f3; }

        .doc-upload-row {
            display: grid; grid-template-columns: 160px 1fr; align-items: center;
            margin-bottom: 14px; font-size: 14px;
        }
        .doc-upload-row label { font-weight: 600; color: #333; }
        .doc-upload-row input[type="file"] { width: 100%; }
        .upload-status { font-size: 12px; color: #666; margin-top: 6px; }
        .upload-status.success { color: #0f7a3f; }
        .upload-status.error { color: #c0392b; }

        /* Footer/Next Button */
        .footer-action { width: 90%; max-width: 1000px; margin: 0 auto 60px auto; text-align: right; }
        .btn-next {
            background-color: #fdd65b; border: none; padding: 14px 50px; font-weight: bold;
            font-size: 14px; cursor: pointer; border-radius: 4px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .btn-next:hover { background-color: #e5bf4c; }
    </style>
</head>
<body>

    <!-- UNIFORM NAVBAR -->
    <header>
        <div style="display: flex; align-items: center; gap: 30px;">
            <img src="/images/LOGO.png" style="height: 36px; width: auto;" alt="Logo">
        </div>
        <div style="display: flex; align-items: center; gap: 24px;">
            <div style="display: flex; background-color: rgba(255,255,255,0.2); padding: 3px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.3); backdrop-filter: blur(8px);">
                <button style="background: none; color: rgba(255,255,255,0.7); border: none; padding: 6px 20px; font-size: 11px; font-weight: 800; border-radius: 20px; cursor: pointer;">BUY</button>
                <button onclick="if (!(window.handleSellEntryAction && window.handleSellEntryAction(event))) { const r=(sessionStorage.getItem('currentUserRole')||'').toLowerCase(); if (r==='admin') { window.location.href='../admin.html'; } else if (r==='seller') { window.location.href='../sellerhomeprofile.html'; } else { window.location.href='../sellerregistration.html'; } }" style="background-color: #ffffff; color: #000000; border: none; padding: 6px 20px; font-size: 11px; font-weight: 800; border-radius: 20px; cursor: pointer;">SELL</button>
            </div>
            <a href="/index.html" style="color:white; font-size:20px; text-decoration:none;"><i class="fa-solid fa-house"></i></a>
            <a href="/shoppingcart.html" style="color:white; font-size:20px; text-decoration:none;"><i class="fa-solid fa-bag-shopping"></i></a>
            <span id="loginStatus" style="color: #000000; font-size: 12px; font-weight: 600; background-color: rgba(255, 255, 255, 0.7); padding: 4px 8px; border-radius: 4px;">Not logged in</span>
        </div>
    </header>

    <div class="main-container">
        <div class="tabs">
            <div class="tab active">Shop Information</div>
            <a href="/css/ReviewSubmit.html" class="tab" id="tab-review" onclick="return handleReviewTabClick(event)">Review & Submit</a>
        </div>

        <div class="form-content">
            <div class="left-column">
                <input type="file" id="logoInput" accept="image/*" style="display: none;">
                <div class="upload-box" id="uploadBox">
                    <span id="uploadText">Upload Shop Logo/ Photo</span>
                </div>
                <div id="status-profile-image" class="upload-status" style="margin-top:10px;">Not uploaded</div>
            </div>
            
            <div class="right-column">
                <div class="section-title">Shop Information</div>
                <div class="input-group">
                    <label>Shop Name</label>
                    <input type="text" id="shopName" placeholder="">
                </div>
                <div class="input-group">
                    <label>Shop Description</label>
                    <textarea id="shopDesc" placeholder=""></textarea>
                </div>

                <div class="section-title">Location</div>
                <div class="input-group">
                    <label>Pick-up Address</label>
                    <input type="text" id="address" placeholder="">
                </div>
                <div class="input-group">
                    <label>City</label>
                    <input type="text" id="city" placeholder="">
                </div>
                <div class="input-group">
                    <label>Province</label>
                    <input type="text" id="province" placeholder="">
                </div>

                <div class="section-title">Verification</div>
                <div class="input-group">
                    <label>Contact Number</label>
                    <input type="tel" id="contact" placeholder="">
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="">
                </div>
                <div class="verification-row">
                    <input type="text" placeholder="Verification Code" disabled>
                    <button class="btn-send">Send</button>
                </div>

                <div class="section-title">Business Documents</div>
                <div class="doc-upload-row">
                    <label for="businessPermitInput">Business Permit</label>
                    <div>
                        <input type="file" id="businessPermitInput" accept="image/*,application/pdf">
                        <div id="status-business-permit" class="upload-status">Not uploaded</div>
                    </div>
                </div>
                <div class="doc-upload-row">
                    <label for="birTaxInput">BIR/Tax Certificate</label>
                    <div>
                        <input type="file" id="birTaxInput" accept="image/*,application/pdf">
                        <div id="status-bir-tax" class="upload-status">Not uploaded</div>
                    </div>
                </div>
                <div class="doc-upload-row">
                    <label for="govIdInput">Government ID</label>
                    <div>
                        <input type="file" id="govIdInput" accept="image/*,application/pdf">
                        <div id="status-government-id" class="upload-status">Not uploaded</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer-action">
        <button class="btn-next" onclick="goToReview()">NEXT</button>
    </div>

    <script src="/js/app.js"></script>
    <script>
        const DOCUMENT_KEY = 'sellerDocumentMap';
        const STEP1_KEY = 'sellerRegistrationStep1Done';

        // Image Upload Logic[cite: 5]
        const uploadBox = document.getElementById('uploadBox');
        const logoInput = document.getElementById('logoInput');
        const uploadText = document.getElementById('uploadText');
        const businessPermitInput = document.getElementById('businessPermitInput');
        const birTaxInput = document.getElementById('birTaxInput');
        const govIdInput = document.getElementById('govIdInput');

        function getDocumentMap() {
            const raw = sessionStorage.getItem(DOCUMENT_KEY);
            if (!raw) return {};
            try {
                return JSON.parse(raw);
            } catch (e) {
                return {};
            }
        }

        function setDocumentMap(map) {
            sessionStorage.setItem(DOCUMENT_KEY, JSON.stringify(map));
        }

        function updateStatusElement(id, text, stateClass) {
            const el = document.getElementById(id);
            if (!el) return;
            el.textContent = text;
            el.classList.remove('success', 'error');
            if (stateClass) {
                el.classList.add(stateClass);
            }
        }

        function getAuthHeaders() {
            const token = sessionStorage.getItem('authToken');
            return token ? { 'Authorization': 'Bearer ' + token } : {};
        }

        function ensureLoggedInForSellerRegistration() {
            const token = sessionStorage.getItem('authToken');
            const currentUserId = sessionStorage.getItem('currentUserId');
            if (!token || !currentUserId) {
                const next = '/css/SellerRegistration2.html';
                window.location.href = '/login.html?next=' + encodeURIComponent(next);
                return false;
            }
            return true;
        }

        async function uploadDocument(documentType, file, statusElementId) {
            const currentUserId = sessionStorage.getItem('currentUserId');
            if (!currentUserId) {
                throw new Error('You must be logged in to upload documents.');
            }

            if (!file) {
                throw new Error('Please select a file.');
            }

            const allowedType = (file.type || '').startsWith('image/') || file.type === 'application/pdf';
            if (!allowedType) {
                throw new Error('Only image and PDF files are allowed.');
            }

            if (file.size > 10 * 1024 * 1024) {
                throw new Error('File exceeds 10MB limit.');
            }

            updateStatusElement(statusElementId, 'Uploading...', null);

            const formData = new FormData();
            formData.append('userId', currentUserId);
            formData.append('documentType', documentType);
            formData.append('file', file);

            const response = await fetch('/api/seller/documents', {
                method: 'POST',
                headers: getAuthHeaders(),
                body: formData
            });

            if (!response.ok) {
                let message = '';
                const contentType = response.headers.get('content-type') || '';
                if (contentType.includes('application/json')) {
                    try {
                        const errorJson = await response.json();
                        message = errorJson.message || errorJson.error || '';
                    } catch (e) {
                        message = '';
                    }
                }
                if (!message) {
                    message = await response.text();
                }
                if (!message) {
                    message = 'Upload failed (HTTP ' + response.status + ').';
                }
                throw new Error(message);
            }

            const uploaded = await response.json();
            const map = getDocumentMap();
            map[documentType] = {
                documentId: uploaded.documentId,
                filePath: uploaded.filePath,
                originalFileName: uploaded.originalFileName || file.name,
                contentType: uploaded.contentType || file.type
            };
            setDocumentMap(map);
            updateStatusElement(statusElementId, 'Uploaded: ' + (uploaded.originalFileName || file.name), 'success');
            return uploaded;
        }

        function hydrateUploadStatuses() {
            const map = getDocumentMap();
            if (map.BUSINESS_PERMIT) {
                updateStatusElement('status-business-permit', 'Uploaded: ' + (map.BUSINESS_PERMIT.originalFileName || 'Business Permit'), 'success');
            }
            if (map.BIR_TAX_CERTIFICATE) {
                updateStatusElement('status-bir-tax', 'Uploaded: ' + (map.BIR_TAX_CERTIFICATE.originalFileName || 'BIR/Tax Certificate'), 'success');
            }
            if (map.GOVERNMENT_ID) {
                updateStatusElement('status-government-id', 'Uploaded: ' + (map.GOVERNMENT_ID.originalFileName || 'Government ID'), 'success');
            }
            if (map.PROFILE_IMAGE) {
                updateStatusElement('status-profile-image', 'Uploaded: ' + (map.PROFILE_IMAGE.originalFileName || 'Profile Image'), 'success');
            }
        }

        function validateRequiredFields() {
            const requiredIds = ['shopName', 'shopDesc', 'address', 'city', 'province', 'contact', 'email'];
            for (const id of requiredIds) {
                const value = (document.getElementById(id).value || '').trim();
                if (!value) {
                    alert('Please complete all required shop fields before continuing.');
                    return false;
                }
            }

            const map = getDocumentMap();
            const requiredDocs = ['PROFILE_IMAGE', 'BUSINESS_PERMIT', 'BIR_TAX_CERTIFICATE', 'GOVERNMENT_ID'];
            const missing = requiredDocs.filter(type => !map[type] || !map[type].documentId);
            if (missing.length > 0) {
                alert('Please upload profile image, Business Permit, BIR/Tax Certificate, and Government ID before continuing.');
                return false;
            }

            return true;
        }

        uploadBox.addEventListener('click', () => {
            logoInput.click();
        });

        logoInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imageUrl = e.target.result;
                    uploadBox.style.backgroundImage = `url(${imageUrl})`;
                    uploadText.style.display = 'none';
                    uploadBox.style.border = 'none';
                    localStorage.setItem('shopLogo', imageUrl);
                }
                reader.readAsDataURL(file);

                uploadDocument('PROFILE_IMAGE', file, 'status-profile-image')
                    .catch(error => {
                        alert(error.message || 'Profile upload failed.');
                    });
            }
        });

        businessPermitInput.addEventListener('change', function() {
            const file = this.files[0];
            if (!file) return;
            uploadDocument('BUSINESS_PERMIT', file, 'status-business-permit').catch(error => {
                updateStatusElement('status-business-permit', error.message || 'Upload failed', 'error');
            });
        });

        birTaxInput.addEventListener('change', function() {
            const file = this.files[0];
            if (!file) return;
            uploadDocument('BIR_TAX_CERTIFICATE', file, 'status-bir-tax').catch(error => {
                updateStatusElement('status-bir-tax', error.message || 'Upload failed', 'error');
            });
        });

        govIdInput.addEventListener('change', function() {
            const file = this.files[0];
            if (!file) return;
            uploadDocument('GOVERNMENT_ID', file, 'status-government-id').catch(error => {
                updateStatusElement('status-government-id', error.message || 'Upload failed', 'error');
            });
        });

        function saveData() {
            localStorage.setItem('shopName', document.getElementById('shopName').value);
            localStorage.setItem('shopDesc', document.getElementById('shopDesc').value);
            localStorage.setItem('address', document.getElementById('address').value);
            localStorage.setItem('city', document.getElementById('city').value);
            localStorage.setItem('province', document.getElementById('province').value);
            localStorage.setItem('contact', document.getElementById('contact').value);
            localStorage.setItem('email', document.getElementById('email').value);
        }

        function goToReview() {
            if (!validateRequiredFields()) {
                return;
            }
            saveData();
            sessionStorage.setItem(STEP1_KEY, '1');
            window.location.href = "/css/ReviewSubmit.html";
        }

        function handleReviewTabClick(event) {
            event.preventDefault();
            if (!validateRequiredFields()) {
                return false;
            }
            goToReview();
            return false;
        }

        window.onload = function() {
            if (!ensureLoggedInForSellerRegistration()) {
                return;
            }

            if(localStorage.getItem('shopName')) document.getElementById('shopName').value = localStorage.getItem('shopName');
            if(localStorage.getItem('shopDesc')) document.getElementById('shopDesc').value = localStorage.getItem('shopDesc');
            if(localStorage.getItem('address')) document.getElementById('address').value = localStorage.getItem('address');
            if(localStorage.getItem('city')) document.getElementById('city').value = localStorage.getItem('city');
            if(localStorage.getItem('province')) document.getElementById('province').value = localStorage.getItem('province');
            if(localStorage.getItem('contact')) document.getElementById('contact').value = localStorage.getItem('contact');
            if(localStorage.getItem('email')) document.getElementById('email').value = localStorage.getItem('email');
            
            if(localStorage.getItem('shopLogo')) {
                uploadBox.style.backgroundImage = `url(${localStorage.getItem('shopLogo')})`;
                uploadText.style.display = 'none';
                uploadBox.style.border = 'none';
            }

            hydrateUploadStatuses();
        }
    </script>
</body>
</html>
