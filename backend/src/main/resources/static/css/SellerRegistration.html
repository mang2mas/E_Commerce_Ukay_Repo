<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Registration</title>
    <style>
        /* CSS Reset & General Styles */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f6f5ef; color: #333; }

        /* Header Styles */
        header {
            background-color: #8c8b86; height: 100px; display: flex;
            justify-content: space-between; align-items: center; padding: 0 60px;
        }
        .logo-img { height: 48px; object-fit: contain; }
        .header-actions { display: flex; align-items: center; gap: 40px; }
        .buy-sell-toggle {
            background-color: rgba(255, 255, 255, 0.2); border-radius: 40px;
            display: flex; font-size: 20px; font-weight: bold; padding: 4px;
            border: 2px solid rgba(255, 255, 255, 0.4); color: white;
        }
        .buy-sell-toggle div { padding: 8px 24px; border-radius: 40px; cursor: pointer; }
        .sell-active { background-color: #fdd65b; color: #333; }
        .home-icon { height: 40px; cursor: pointer; }

        /* Main Form Container */
        .main-container {
            width: 90%; max-width: 1800px; margin: 80px auto; background: white;
            box-shadow: 0 8px 30px rgba(0,0,0,0.05); border-radius: 8px; overflow: hidden;
        }

        /* Tabs */
        .tabs { display: flex; border-bottom: 2px solid #eee; }
        .tab {
            flex: 1; text-align: center; padding: 40px; font-size: 36px; color: #888;
            background-color: #f3f3f3; cursor: pointer; text-decoration: none;
        }
        .tab.active { background-color: white; font-weight: bold; color: #111; cursor: default; border-top-left-radius: 30px; }

        /* Form Layout */
        .form-content { display: flex; padding: 100px; gap: 100px; }
        .left-column { flex: 0 0 400px; }
        .right-column { flex: 1; }
        
        .upload-box {
            width: 400px; height: 400px; border: 2px solid #ccc; display: flex; align-items: center;
            justify-content: center; text-align: center; font-size: 20px; color: #999;
            background-color: #fafafa; cursor: pointer; padding: 40px;
        }

        .section-title { font-size: 28px; font-weight: bold; margin-bottom: 30px; margin-top: 60px; }
        .section-title:first-child { margin-top: 0; }

        /* Grid for Inputs */
        .input-group {
            display: grid; grid-template-columns: 280px 1fr; align-items: start;
            margin-bottom: 30px; font-size: 26px;
        }
        .input-group label { padding-top: 16px; color: #333; }
        input[type="text"], input[type="email"], input[type="tel"], textarea {
            width: 100%; padding: 16px; border: 2px solid #ddd; border-radius: 4px;
            font-size: 26px; outline: none;
        }
        input:focus, textarea:focus { border-color: #aaa; }
        textarea { height: 240px; resize: none; }

        .verification-row { display: flex; gap: 20px; justify-content: flex-end; margin-left: 280px; }
        .verification-row input { background-color: #f3f3f3; text-align: center; color: #888; }
        .btn-send { padding: 16px 30px; border: 2px solid #ddd; background: white; cursor: pointer; font-size: 24px; }

        /* Footer/Next Button */
        .footer-action { width: 90%; max-width: 1800px; margin: 0 auto 80px auto; text-align: right; }
        .btn-next {
            background-color: #fdd65b; border: none; padding: 24px 80px; font-weight: bold;
            font-size: 28px; cursor: pointer; border-radius: 4px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .btn-next:hover { background-color: #e5bf4c; }
    </style>
</head>
<body>

    <header>
        <img src="images/LOGO.png" alt="Logo Placeholder" class="logo-img">
        <div class="header-actions">
            <div class="buy-sell-toggle">
                <div>BUY</div>
                <div class="sell-active">SELL</div>
            </div>
            <img src="images/home.png" alt="Home" class="home-icon">
        </div>
    </header>

    <div class="main-container">
        <div class="tabs">
            <div class="tab active">Shop Information</div>
            <a href="ReviewSubmit.html" class="tab" id="tab-review" onclick="saveData()">Review & Submit</a>
        </div>

        <div class="form-content">
            <div class="left-column">
                <div class="upload-box">Upload Shop Logo/ Photo</div>
            </div>
            
            <div class="right-column">
                <div class="section-title">Shop Information</div>
                <div class="input-group">
                    <label>Shop Name</label>
                    <input type="text" id="shopName" placeholder="">
                </div>
                <div class="input-group">
                    <label>Shop Description</label>
                    <textarea id="shopDesc" placeholder=""></textarea>
                </div>

                <div class="section-title">Location</div>
                <div class="input-group">
                    <label>Pick-up Address</label>
                    <input type="text" id="address" placeholder="">
                </div>
                <div class="input-group">
                    <label>City</label>
                    <input type="text" id="city" placeholder="">
                </div>
                <div class="input-group">
                    <label>Province</label>
                    <input type="text" id="province" placeholder="">
                </div>

                <div class="section-title">Verification</div>
                <div class="input-group">
                    <label>Contact Number</label>
                    <input type="tel" id="contact" placeholder="">
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="">
                </div>
                <div class="verification-row">
                    <input type="text" placeholder="Verification Code" disabled>
                    <button class="btn-send">Send</button>
                </div>
            </div>
        </div>
    </div>

    <div class="footer-action">
        <button class="btn-next" onclick="goToReview()">NEXT</button>
    </div>

    <script>
        function saveData() {
            localStorage.setItem('shopName', document.getElementById('shopName').value);
            localStorage.setItem('shopDesc', document.getElementById('shopDesc').value);
            localStorage.setItem('address', document.getElementById('address').value);
            localStorage.setItem('city', document.getElementById('city').value);
            localStorage.setItem('province', document.getElementById('province').value);
            localStorage.setItem('contact', document.getElementById('contact').value);
            localStorage.setItem('email', document.getElementById('email').value);
        }

        function goToReview() {
            saveData();
            window.location.href = "ReviewSubmit.html";
        }

        window.onload = function() {
            if(localStorage.getItem('shopName')) document.getElementById('shopName').value = localStorage.getItem('shopName');
            if(localStorage.getItem('shopDesc')) document.getElementById('shopDesc').value = localStorage.getItem('shopDesc');
            if(localStorage.getItem('address')) document.getElementById('address').value = localStorage.getItem('address');
            if(localStorage.getItem('city')) document.getElementById('city').value = localStorage.getItem('city');
            if(localStorage.getItem('province')) document.getElementById('province').value = localStorage.getItem('province');
            if(localStorage.getItem('contact')) document.getElementById('contact').value = localStorage.getItem('contact');
            if(localStorage.getItem('email')) document.getElementById('email').value = localStorage.getItem('email');
        }
    </script>
</body>
</html>
