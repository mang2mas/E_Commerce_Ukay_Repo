<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Registration</title>
  <link rel="stylesheet" href="./sellerregistration.css" />
  <style>
    .form-section { margin-top: 24px; text-align: left; }
    .form-section label { display: block; margin-bottom: 8px; font-weight: 700; color: #333; }
    .form-section input, .form-section textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; margin-bottom: 18px; }
    .form-section textarea { resize: vertical; min-height: 120px; }
  </style>
</head>
<body>
  <main class="SHOP-REGISTRATION" data-model-id="1:8076">
    <div class="rectangle" aria-hidden="true"></div>
    <div class="div" aria-hidden="true"></div>

    <header class="header-seller">
      <div class="header-left">
        <a href="/index.html" aria-label="Go to homepage">
          <img class="untitled-design" src="/images/LOGO.png" alt="UKY logo" />
        </a>
      </div>
      <div class="header-right">
        <div class="toggle-container">
          <button class="toggle-btn">BUY</button>
          <button class="toggle-btn active">SELL</button>
        </div>
        <a href="/index.html" class="home-link" aria-label="Home">
          <svg class="home-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" fill="currentColor" />
          </svg>
        </a>
      </div>
    </header>

    <section class="card" aria-labelledby="registration-title">
      <div class="card-inner">
        <img class="check-list" src="/images/LOGO.png" alt="UKY logo" />
        <p class="register-now-and">Complete your seller registration details to continue.</p>

        <div class="form-section">
          <label for="shopName">Shop Name</label>
          <input id="shopName" type="text" placeholder="Enter your shop name" />

          <label for="shopEmail">Email Address</label>
          <input id="shopEmail" type="email" placeholder="seller@example.com" />

          <label for="shopPhone">Contact Number</label>
          <input id="shopPhone" type="tel" placeholder="09XX XXX XXXX" />

          <label for="shopAddress">Shop Address</label>
          <textarea id="shopAddress" placeholder="Enter your shop address"></textarea>
        </div>

        <button type="button" class="register-btn" id="nextButton">Next</button>
      </div>
    </section>
  </main>

  <script>
    const nextButton = document.getElementById('nextButton');
    if (nextButton) {
      nextButton.addEventListener('click', function() {
        window.location.href = './ReviewSubmit.html';
      });
    }
  </script>
</body>
</html>
