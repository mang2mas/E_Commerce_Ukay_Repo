<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review & Submit</title>
    <style>
        /* CSS Reset & General Styles */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f6f5ef; color: #333; }

        /* Header Styles */
        header {
            background-color: #8c8b86; height: 100px; display: flex;
            justify-content: space-between; align-items: center; padding: 0 60px;
        }
        .logo-img { height: 48px; object-fit: contain; }
        .header-actions { display: flex; align-items: center; gap: 40px; }
        .buy-sell-toggle {
            background-color: rgba(255, 255, 255, 0.2); border-radius: 40px;
            display: flex; font-size: 20px; font-weight: bold; padding: 4px;
            border: 2px solid rgba(255, 255, 255, 0.4); color: white;
        }
        .buy-sell-toggle div { padding: 8px 24px; border-radius: 40px; cursor: pointer; }
        .sell-active { background-color: #fdd65b; color: #333; }
        .home-icon { height: 40px; cursor: pointer; }

        /* Main Form Container */
        .main-container {
            width: 90%; max-width: 1800px; margin: 80px auto; background: white;
            box-shadow: 0 8px 30px rgba(0,0,0,0.05); border-radius: 8px; overflow: hidden; padding-bottom: 60px;
        }

        /* Tabs */
        .tabs { display: flex; border-bottom: 2px solid #eee; }
        .tab {
            flex: 1; text-align: center; padding: 40px; font-size: 36px; color: #888;
            background-color: #f3f3f3; cursor: pointer; text-decoration: none;
        }
        .tab.active { background-color: white; font-weight: bold; color: #111; cursor: default; border-top-right-radius: 30px; }

        /* Review Content */
        .review-content { padding: 80px 120px; }
        
        .review-intro { display: flex; align-items: flex-start; gap: 30px; margin-bottom: 50px; }
        .review-intro .doc-icon { font-size: 48px; color: #555; }
        .review-intro h2 { font-size: 32px; margin-bottom: 8px; color: #111; }
        .review-intro p { font-size: 22px; color: #666; }

        /* Beige Review Box */
        .review-box {
            background-color: #f8f7f2; border: 2px solid #e0dfd5; padding: 80px;
            position: relative; margin-bottom: 60px;
        }

        .btn-edit {
            position: absolute; top: 60px; right: 60px; background: white; border: 2px solid #ccc;
            padding: 10px 30px; border-radius: 8px; cursor: pointer; font-size: 24px; color: #333;
        }
        .btn-edit:hover { background: #f0f0f0; }

        .box-title { font-size: 28px; margin-bottom: 60px; display: flex; align-items: center; gap: 20px; }

        .review-grid { display: flex; gap: 80px; }

        /* Left Side */
        .review-left { flex: 0 0 320px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        
        .profile-pic-container {
            width: 280px; height: 280px; border-radius: 50%; border: 8px solid #1a8cff;
            overflow: hidden; margin-bottom: 40px; background-color: white;
        }
        .profile-pic-container img { width: 100%; height: 100%; object-fit: cover; }

        .contact-info { text-align: left; width: 100%; font-size: 22px; }
        .contact-info strong { display: block; margin-top: 30px; color: #111; }
        .contact-info output { display: block; color: #555; margin-top: 4px; }

        /* Right Side */
        .review-right { flex: 1; }
        
        .readonly-input {
            width: 100%; max-width: 700px; padding: 16px 24px; border: 2px solid #a3a3a3;
            background-color: white; font-size: 26px; margin-bottom: 40px; color: #333; outline: none;
        }
        .bold-input { font-weight: bold; font-size: 32px; border-color: #555; }

        .readonly-textarea {
            width: 100%; height: 280px; padding: 24px; border: 2px solid #a3a3a3;
            background-color: white; font-size: 22px; resize: none; margin-bottom: 80px;
            color: #333; line-height: 1.5; outline: none;
        }

        .location-fields label { display: block; font-size: 22px; margin-bottom: 8px; color: #111; }
        .location-fields .readonly-input { margin-bottom: 30px; }

        /* Checkboxes */
        .checkbox-section { display: flex; flex-direction: column; gap: 24px; padding-left: 20px; }
        .checkbox-section label { font-size: 24px; color: #444; display: flex; align-items: center; gap: 20px; cursor: pointer; }
        
        /* Make checkboxes physically larger */
        input[type="checkbox"] { transform: scale(2); margin-left: 10px; }

        /* Footer / Submit Button */
        .footer-action { width: 90%; max-width: 1800px; margin: 0 auto 80px auto; text-align: right; }
        .btn-submit {
            background-color: #fdd65b; border: none; padding: 24px 80px; font-weight: bold;
            font-size: 28px; cursor: pointer; border-radius: 4px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .btn-submit:hover { background-color: #e5bf4c; }
    </style>
</head>
<body>

    <header>
        <img src="images/LOGO.png" alt="Logo Placeholder" class="logo-img">
        <div class="header-actions">
            <div class="buy-sell-toggle">
                <div>BUY</div>
                <div class="sell-active">SELL</div>
            </div>
            <img src="images/home.png" alt="Home" class="home-icon">
        </div>
    </header>

    <div class="main-container">
        <div class="tabs">
            <a href="SellerRegistration.html" class="tab">Shop Information</a>
            <div class="tab active">Review & Submit</div>
        </div>

        <div class="review-content">
            <div class="review-intro">
                <span class="doc-icon">📄</span>
                <div>
                    <h2>Review Shop Information</h2>
                    <p>Please review all entered information before submitting.</p>
                </div>
            </div>

            <div class="review-box">
                <button class="btn-edit" onclick="window.location.href='SellerRegistration.html'">✏️ Edit</button>
                <h3 class="box-title">🏪 Shop Information</h3>

                <div class="review-grid">
                    <div class="review-left">
                        <div class="profile-pic-container">
                            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?q=80&w=300&auto=format&fit=crop" alt="Profile Picture">
                        </div>
                        <div class="contact-info">
                            <strong>Contact Number</strong>
                            <output id="rev-contact">-</output>
                            <strong>Email Address</strong>
                            <output id="rev-email">-</output>
                        </div>
                    </div>

                    <div class="review-right">
                        <input type="text" id="rev-shopName" readonly class="readonly-input bold-input" value="aestheThrift">
                        <textarea id="rev-shopDesc" readonly class="readonly-textarea">Welcome to @aestheThrift!

We specialize in handpicked thrifted clothing that combines style, affordability, and sustainability.

From vintage gems to everyday essentials, our collection is perfect for fashion lovers who want unique pieces without breaking the bank.

Every purchase supports a more eco-friendly future while helping you build a wardrobe that's truly your own.</textarea>

                        <div class="location-fields">
                            <label>Pick-up Address</label>
                            <input type="text" id="rev-address" readonly class="readonly-input" value="123 Sampaguita St., Brgy. Pila-Pila">
                            <label>City</label>
                            <input type="text" id="rev-city" readonly class="readonly-input" value="Biringan City">
                            <label>Province</label>
                            <input type="text" id="rev-province" readonly class="readonly-input" value="Laguna">
                        </div>
                    </div>
                </div>
            </div>

            <div class="checkbox-section">
                <label><input type="checkbox" id="check1"> Everything above is correct</label>
                <label><input type="checkbox" id="check2"> I agree to the Terms and Conditions</label>
                <label><input type="checkbox" id="check3"> I agree to the Seller Policy</label>
            </div>
        </div>
    </div>

    <div class="footer-action">
        <button class="btn-submit" onclick="submitForm()">NEXT</button>
    </div>

    <script>
        window.onload = function() {
            if(localStorage.getItem('shopName')) document.getElementById('rev-shopName').value = localStorage.getItem('shopName');
            if(localStorage.getItem('shopDesc')) document.getElementById('rev-shopDesc').value = localStorage.getItem('shopDesc');
            if(localStorage.getItem('address')) document.getElementById('rev-address').value = localStorage.getItem('address');
            if(localStorage.getItem('city')) document.getElementById('rev-city').value = localStorage.getItem('city');
            if(localStorage.getItem('province')) document.getElementById('rev-province').value = localStorage.getItem('province');
            if(localStorage.getItem('contact')) document.getElementById('rev-contact').textContent = localStorage.getItem('contact');
            if(localStorage.getItem('email')) document.getElementById('rev-email').textContent = localStorage.getItem('email');
        }

        function submitForm() {
            const c1 = document.getElementById('check1').checked;
            const c2 = document.getElementById('check2').checked;
            const c3 = document.getElementById('check3').checked;

            if (c1 && c2 && c3) {
                window.location.href = '/addproduct.html';
            } else {
                alert('Please check all confirmation boxes before continuing.');
            }
        }
    </script>
</body>
</html>
