<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review & Submit</title>
    <!-- FontAwesome for Navbar Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Reset & General Styles */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f6f5ef; color: #333; padding-top: 90px; }

        /* UNIFORM NAVBAR */
        header { background-color: rgba(36, 36, 36, 0.50); backdrop-filter: blur(8px); position: fixed; top: 0; left: 0; width: 100%; height: 90px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; z-index: 9999; }

        /* Main Form Container */
        .main-container {
            width: 90%; max-width: 1000px; margin: 40px auto; background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-radius: 8px; overflow: hidden; padding-bottom: 40px;
        }

        /* Tabs */
        .tabs { display: flex; border-bottom: 1px solid #eee; }
        .tab {
            flex: 1; text-align: center; padding: 20px; font-size: 18px; color: #888;
            background-color: #f3f3f3; cursor: pointer; text-decoration: none;
        }
        .tab.active { background-color: white; font-weight: bold; color: #111; cursor: default; border-top-right-radius: 20px; }

        /* Review Content */
        .review-content { padding: 50px 60px; }
        
        .review-intro { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 40px; }
        .review-intro .doc-icon { font-size: 32px; color: #555; margin-top: 4px; }
        .review-intro h2 { font-size: 24px; margin-bottom: 6px; color: #111; }
        .review-intro p { font-size: 14px; color: #666; }

        /* Beige Review Box */
        .review-box {
            background-color: #f8f7f2; border: 1px solid #e0dfd5; padding: 40px;
            position: relative; margin-bottom: 40px; border-radius: 8px;
        }

        .btn-edit {
            position: absolute; top: 30px; right: 30px; background: white; border: 1px solid #ccc;
            padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; color: #333; font-weight: bold;
        }
        .btn-edit:hover { background: #f0f0f0; }

        .box-title { font-size: 18px; margin-bottom: 30px; display: flex; align-items: center; gap: 12px; font-weight: bold; }

        .review-grid { display: flex; gap: 40px; }

        /* Left Side */
        .review-left { flex: 0 0 200px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        
        .profile-pic-container {
            width: 160px; height: 160px; border-radius: 50%; border: 4px solid #1a8cff;
            overflow: hidden; margin-bottom: 20px; background-color: white;
        }
        .profile-pic-container img { width: 100%; height: 100%; object-fit: cover; }

        .contact-info { text-align: left; width: 100%; font-size: 13px; }
        .contact-info strong { display: block; margin-top: 20px; color: #111; }
        .contact-info output { display: block; color: #555; margin-top: 4px; }

        /* Right Side */
        .review-right { flex: 1; }
        
        .readonly-input {
            width: 100%; max-width: 500px; padding: 12px 16px; border: 1px solid #a3a3a3; border-radius: 4px;
            background-color: white; font-size: 14px; margin-bottom: 24px; color: #333; outline: none;
        }
        .bold-input { font-weight: bold; font-size: 18px; border-color: #555; }

        .readonly-textarea {
            width: 100%; height: 160px; padding: 16px; border: 1px solid #a3a3a3; border-radius: 4px;
            background-color: white; font-size: 14px; resize: none; margin-bottom: 40px;
            color: #333; line-height: 1.5; outline: none;
        }

        .location-fields label { display: block; font-size: 14px; margin-bottom: 6px; color: #111; font-weight: 600; }
        .location-fields .readonly-input { margin-bottom: 20px; }

        /* Checkboxes */
        .checkbox-section { display: flex; flex-direction: column; gap: 16px; padding-left: 10px; }
        .checkbox-section label { font-size: 14px; color: #444; display: flex; align-items: center; gap: 12px; cursor: pointer; }
        input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }

        /* Footer / Submit Button */
        .footer-action { width: 90%; max-width: 1000px; margin: 0 auto 60px auto; text-align: right; }
        .btn-submit {
            background-color: #fdd65b; border: none; padding: 14px 50px; font-weight: bold;
            font-size: 14px; cursor: pointer; border-radius: 4px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .btn-submit:hover { background-color: #e5bf4c; }
    </style>
</head>
<body>

    <!-- UNIFORM NAVBAR -->
    <header>
        <div style="display: flex; align-items: center; gap: 30px;">
            <img src="/images/LOGO.png" style="height: 36px; width: auto;" alt="Logo">
        </div>
        <div style="display: flex; align-items: center; gap: 24px;">
            <div style="display: flex; background-color: rgba(255,255,255,0.2); padding: 3px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.3); backdrop-filter: blur(8px);">
                <button style="background: none; color: rgba(255,255,255,0.7); border: none; padding: 6px 20px; font-size: 11px; font-weight: 800; border-radius: 20px; cursor: pointer;">BUY</button>
                <button style="background-color: #ffffff; color: #000000; border: none; padding: 6px 20px; font-size: 11px; font-weight: 800; border-radius: 20px; cursor: pointer;">SELL</button>
            </div>
            <a href="index.html" style="color:white; font-size:20px; text-decoration:none;"><i class="fa-solid fa-house"></i></a>
            <a href="shoppingcart.html" style="color:white; font-size:20px; text-decoration:none;"><i class="fa-solid fa-bag-shopping"></i></a>
            <span id="loginStatus" style="color: #000000; font-size: 12px; font-weight: 600; background-color: rgba(255, 255, 255, 0.7); padding: 4px 8px; border-radius: 4px;">Not logged in</span>
        </div>
    </header>

    <div class="main-container">
        <!-- ... inside <div class="tabs"> ... -->
<div class="tabs">
    <a href="SellerRegistration2.html" class="tab">Shop Information</a>
    <div class="tab active">Review & Submit</div>
</div>

<!-- ... inside the .review-box ... -->
<button class="btn-edit" onclick="window.location.href='SellerRegistration2.html'">✏️ Edit</button>

        <div class="review-content">
            <div class="review-intro">
                <span class="doc-icon">📄</span>
                <div>
                    <h2>Review Shop Information</h2>
                    <p>Please review all entered information before submitting.</p>
                </div>
            </div>

            <div class="review-box">
                <button class="btn-edit" onclick="window.location.href='SellerRegistration2.html'">✏️ Edit</button>
                <h3 class="box-title">🏪 Shop Information</h3>

                <div class="review-grid">
                    <div class="review-left">
                        <div class="profile-pic-container">
                            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?q=80&w=300&auto=format&fit=crop" alt="Profile Picture">
                        </div>
                        <div class="contact-info">
                            <strong>Contact Number</strong>
                            <output id="rev-contact">-</output>
                            <strong>Email Address</strong>
                            <output id="rev-email">-</output>
                        </div>
                    </div>

                    <div class="review-right">
                        <input type="text" id="rev-shopName" readonly class="readonly-input bold-input">
                        <textarea id="rev-shopDesc" readonly class="readonly-textarea"></textarea>

                        <div class="location-fields">
                            <label>Pick-up Address</label>
                            <input type="text" id="rev-address" readonly class="readonly-input">
                            <label>City</label>
                            <input type="text" id="rev-city" readonly class="readonly-input">
                            <label>Province</label>
                            <input type="text" id="rev-province" readonly class="readonly-input">
                        </div>
                    </div>
                </div>
            </div>

            <div class="checkbox-section">
                <label><input type="checkbox" id="check1"> Everything above is correct</label>
                <label><input type="checkbox" id="check2"> I agree to the Terms and Conditions</label>
                <label><input type="checkbox" id="check3"> I agree to the Seller Policy</label>
            </div>
        </div>
    </div>

    <div class="footer-action">
        <button class="btn-submit" onclick="submitForm()">NEXT</button>
    </div>

    <script>
        window.onload = function() {
            if(localStorage.getItem('shopName')) document.getElementById('rev-shopName').value = localStorage.getItem('shopName');
            if(localStorage.getItem('shopDesc')) document.getElementById('rev-shopDesc').value = localStorage.getItem('shopDesc');
            if(localStorage.getItem('address')) document.getElementById('rev-address').value = localStorage.getItem('address');
            if(localStorage.getItem('city')) document.getElementById('rev-city').value = localStorage.getItem('city');
            if(localStorage.getItem('province')) document.getElementById('rev-province').value = localStorage.getItem('province');
            if(localStorage.getItem('contact')) document.getElementById('rev-contact').textContent = localStorage.getItem('contact');
            if(localStorage.getItem('email')) document.getElementById('rev-email').textContent = localStorage.getItem('email');
        }

        function submitForm() {
            const c1 = document.getElementById('check1').checked;
            const c2 = document.getElementById('check2').checked;
            const c3 = document.getElementById('check3').checked;

            if (c1 && c2 && c3) {
                window.location.href = '../sellerhomeprofile.html';
            } else {
                alert('Please check all confirmation boxes before continuing.');
            }
        }
    </script>
</body>
</html>
