<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Audit Logs</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --bg-cream: #faf9ee; --text-black: #000000; --border-gray: #e5e5e5; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-cream); margin: 0; padding-top: 110px; }
        
        /* Unified Admin Header */
        header { background-color: rgba(36, 36, 36, 0.50); backdrop-filter: blur(8px); position: fixed; top: 0; left: 0; width: 100%; height: 90px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; z-index: 9999; }
        .header-actions { display: flex; gap: 15px; align-items: center; }
        .header-btn { color: white; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.35); border-radius: 999px; padding: 8px 16px; text-decoration: none; font-weight: 700; font-size: 13px; transition: background 0.2s ease; }
        .header-btn:hover { background: rgba(255,255,255,0.22); }
        
        /* Dashboard Layout */
        .admin-layout { max-width: 1400px; margin: 0 auto 30px auto; padding: 0 20px; }
        .card { background: white; border: 1px solid var(--border-gray); border-radius: 8px; padding: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        /* Filtering UI */
        .controls { display: flex; gap: 15px; margin-bottom: 25px; }
        .filter-input { padding: 10px 15px; border: 1px solid var(--border-gray); border-radius: 4px; font-family: 'Inter', sans-serif; font-size: 13px; outline: none; }

        /* Table */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; font-size: 12px; color: #888; padding: 15px; text-transform: uppercase; border-bottom: 2px solid #eee; }
        td { padding: 20px 15px; border-top: 1px solid #eee; font-size: 14px; color: #333; }
        
        /* Action Tags */
        .action-tag { padding: 4px 10px; border-radius: 4px; font-weight: 700; font-size: 11px; text-transform: uppercase; }
        .status-success { color: #2e7d32; font-weight: 600; }
    </style>
</head>
<body>

    <header>
        <div style="color: white; font-weight: 800; font-size: 20px; letter-spacing: 1px;">ADMIN PORTAL</div>
        <div class="header-actions">
            <a href="adminseller.html" class="header-btn">Seller Verifications</a>
            <a href="adminuser.html" class="header-btn">User Verifications</a>
            <a href="admincustomers.html" class="header-btn">Customers</a>
            <a href="contentmoderation.html" class="header-btn">Moderation</a>
            <a href="#" class="header-btn" onclick="sessionStorage.clear();window.location.href='./login.html';return false;">Logout</a>
            <div style="display: flex; align-items: center; gap: 10px; color: white; margin-left: 15px;">
                <i class="fa-solid fa-user-circle" style="font-size: 18px;"></i>
                <span id="adminNameDisplay" style="font-size: 14px;">Administrator</span>
                <span id="loginStatus" style="color: #000; background: rgba(255, 255, 255, 0.9); padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700;">Logged in</span>
            </div>
        </div>
    </header>

    <main class="admin-layout">
        <section class="card">
            <h2 style="margin-bottom: 20px; font-size: 22px;">Admin Action Audit Logs</h2>
            
            <div class="controls">
                <input type="text" class="filter-input" placeholder="Search by action..." style="width: 250px;">
                <select class="filter-input">
                    <option>All Actions</option>
                    <option>Verification</option>
                    <option>Moderation</option>
                </select>
                <select class="filter-input">
                    <option>Last 7 Days</option>
                    <option>Last 30 Days</option>
                </select>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Action Performed</th>
                        <th>Admin</th>
                        <th>Description</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="auditLogTable">
                    <tr><td colspan="5" style="text-align:center;padding:40px;color:#666;">Loading audit logs…</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <script>
        const adminId = sessionStorage.getItem('currentUserId');
        const token = sessionStorage.getItem('authToken');
        if (!adminId) window.location.href = './login.html';

        const nameEl = document.getElementById('adminNameDisplay');
        const statusEl = document.getElementById('loginStatus');
        const fullName = sessionStorage.getItem('currentUserFullName');
        if (nameEl && fullName) nameEl.textContent = fullName;
        if (statusEl && fullName) statusEl.textContent = fullName;

        function authHeader() { return token ? { 'Authorization': 'Bearer ' + token } : {}; }

        function actionTagColor(action) {
            const a = (action || '').toUpperCase();
            if (a.includes('APPROVE') || a.includes('VERIFY')) return '#fcd462';
            if (a.includes('REJECT') || a.includes('BAN') || a.includes('REMOVE')) return '#ffcdd2';
            if (a.includes('UPDATE') || a.includes('TOGGLE')) return '#b3e5fc';
            return '#e0e0e0';
        }

        function renderLogs(logs) {
            const tbody = document.getElementById('auditLogTable');
            if (!logs || logs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;color:#666;">No audit logs found.</td></tr>';
                return;
            }
            tbody.innerHTML = logs.map(function(log) {
                const ts = log.createdAt || log.timestamp || log.actionDate;
                const dateStr = ts ? new Date(ts).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—';
                const action = log.action || log.actionType || 'ACTION';
                const admin = log.admin?.fullName || log.adminName || 'Admin';
                const desc = log.description || log.details || log.notes || '—';
                return `
                    <tr>
                        <td style="white-space:nowrap;">${dateStr}</td>
                        <td><span class="action-tag" style="background:${actionTagColor(action)}">${action}</span></td>
                        <td style="font-size:13px;">${admin}</td>
                        <td>${desc}</td>
                        <td class="status-success">Success</td>
                    </tr>
                `;
            }).join('');
        }

        function loadAuditLogs() {
            fetch('/api/admin/audit-logs', { headers: authHeader() })
                .then(function(r) { return r.ok ? r.json() : []; })
                .then(renderLogs)
                .catch(function() {
                    // Fallback: load from requests to synthesize log entries
                    fetch('/api/admin/requests/', { headers: authHeader() })
                        .then(function(r) { return r.ok ? r.json() : []; })
                        .then(function(requests) {
                            const syntheticLogs = (requests || [])
                                .filter(function(r) { return r.status && r.status !== 'PENDING'; })
                                .map(function(r) {
                                    const shopName = r.businessName || 'Unknown';
                                    const action = r.status === 'APPROVED' ? 'APPROVE_SELLER' : 'REJECT_SELLER';
                                    return {
                                        createdAt: r.updatedAt || r.createdAt,
                                        action: action,
                                        admin: r.reviewedBy || {},
                                        description: `${r.status === 'APPROVED' ? 'Approved' : 'Rejected'} seller application for "${shopName}"`
                                    };
                                });
                            renderLogs(syntheticLogs);
                        })
                        .catch(function() {
                            document.getElementById('auditLogTable').innerHTML =
                                '<tr><td colspan="5" style="text-align:center;padding:40px;color:#c62828;">Could not load audit logs.</td></tr>';
                        });
                });
        }

        loadAuditLogs();

        // Search filter
        const searchInput = document.querySelector('.filter-input');
        if (searchInput) {
            searchInput.addEventListener('input', function() {
                const q = this.value.toLowerCase();
                document.querySelectorAll('#auditLogTable tr').forEach(function(tr) {
                    tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
                });
            });
        }
    </script>

</body>
</html>
