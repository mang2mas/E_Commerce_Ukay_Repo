<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Audit Logs</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #f6f1e6;
            --card: #fff;
            --line: #eadfc7;
            --ink: #202020;
            --muted: #6a6a6a;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Segoe UI, sans-serif; color: var(--ink); background: linear-gradient(180deg, #fbf7ee 0%, var(--bg) 60%); }
        .topbar {
            position: sticky; top: 0; z-index: 20;
            background: rgba(30,30,30,0.92); color: #fff;
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 20px;
        }
        .topbar a { color: #fff; text-decoration: none; font-size: 13px; font-weight: 700; border: 1px solid rgba(255,255,255,0.22); padding: 7px 11px; border-radius: 18px; }
        .top-links { display: flex; gap: 8px; align-items: center; }
        .pill { background: #fff; color: #222; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; }

        .wrap { max-width: 1180px; margin: 18px auto 34px; padding: 0 16px; }
        .panel {
            background: var(--card); border: 1px solid var(--line); border-radius: 14px;
            box-shadow: 0 8px 20px rgba(70, 55, 24, 0.08);
            overflow: hidden;
        }
        .panel-head {
            display: flex; justify-content: space-between; align-items: center;
            gap: 10px; padding: 14px; border-bottom: 1px solid var(--line);
            background: #fffaf0;
        }

        input {
            border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font-size: 13px;
            width: 260px;
        }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 10px; border-top: 1px solid #f1ead8; font-size: 13px; text-align: left; vertical-align: middle; }
        th { border-top: none; background: #fffdf7; color: #6f685b; text-transform: uppercase; letter-spacing: 0.04em; font-size: 11px; }

        .tag {
            display: inline-block; border-radius: 12px; padding: 2px 8px; font-size: 11px; font-weight: 700;
            background: #efefef;
        }
        .empty { padding: 28px; text-align: center; color: var(--muted); }
    </style>
</head>
<body>
    <header class="topbar">
        <div style="font-weight: 800; letter-spacing: 0.06em;">ADMIN PORTAL</div>
        <div class="top-links">
            <span id="adminName" class="pill">Admin</span>
            <a href="admin.html">Dashboard</a>
            <a href="adminseller.html">Seller Approvals</a>
            <a href="admincustomers.html">Customer Records</a>
            <a href="adminauditlogs.html">Audit Logs</a>
            <a href="#" onclick="logout();return false;">Logout</a>
        </div>
    </header>

    <main class="wrap">
        <h1 style="margin: 4px 0 6px;">Audit Logs</h1>
        <p style="margin: 0 0 14px; color: #6a6a6a;">Admin login, seller verification, account suspension, and shadow ban actions are recorded here.</p>

        <section class="panel">
            <div class="panel-head">
                <strong><i class="fa-solid fa-clipboard-list"></i> Admin Action History</strong>
                <input id="searchInput" type="text" placeholder="Search action or table">
            </div>

            <div style="overflow:auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>Admin ID</th>
                            <th>Action</th>
                            <th>Table</th>
                        </tr>
                    </thead>
                    <tbody id="logRows">
                        <tr><td colspan="4" class="empty">Loading logs...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const token = sessionStorage.getItem('authToken');
        const role = (sessionStorage.getItem('currentUserRole') || '').toLowerCase();
        const name = sessionStorage.getItem('currentUserFullName') || 'Administrator';

        if (!token || role !== 'admin') {
            alert('Admin access required.');
            window.location.href = './login.html';
        }
        document.getElementById('adminName').textContent = name;

        function authHeader() {
            return { 'Authorization': 'Bearer ' + token };
        }

        function logout() {
            sessionStorage.removeItem('pendingRedirect');
            sessionStorage.clear();
            window.location.replace('./login.html?loggedOut=1');
        }

        let allLogs = [];

        function actionTag(action) {
            return '<span class="tag">' + (action || '-') + '</span>';
        }

        function renderRows(list) {
            const tbody = document.getElementById('logRows');
            if (!list || list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="empty">No audit logs found.</td></tr>';
                return;
            }

            tbody.innerHTML = list.map(log => {
                const date = log.timestamp ? new Date(log.timestamp).toLocaleString() : '-';
                return '<tr>' +
                    '<td>' + date + '</td>' +
                    '<td>' + (log.adminId || '-') + '</td>' +
                    '<td>' + actionTag(log.action) + '</td>' +
                    '<td>' + (log.tableAffected || '-') + '</td>' +
                '</tr>';
            }).join('');
        }

        function applyFilter() {
            const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
            if (!q) {
                renderRows(allLogs);
                return;
            }
            const filtered = allLogs.filter(log => {
                const action = (log.action || '').toLowerCase();
                const table = (log.tableAffected || '').toLowerCase();
                const admin = String(log.adminId || '');
                return action.includes(q) || table.includes(q) || admin.includes(q);
            });
            renderRows(filtered);
        }

        async function loadLogs() {
            try {
                const res = await fetch('/api/admin/audit-logs', { headers: authHeader() });
                if (!res.ok) throw new Error('Failed to load logs');
                allLogs = await res.json();
                renderRows(allLogs);
            } catch (_) {
                document.getElementById('logRows').innerHTML = '<tr><td colspan="4" class="empty">Could not load audit logs.</td></tr>';
            }
        }

        document.getElementById('searchInput').addEventListener('input', applyFilter);
        loadLogs();
    </script>
</body>
</html>
