<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        /* General page layout */
        body {
            font-family: sans-serif;
            background-color: #faf9ee;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* The white center card */
        .reset-card {
            background: white;
            width: 800px;
            padding: 60px 80px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            text-align: center;
            border-radius: 4px;
        }

        .reset-card img {
            height: 60px;
            width: auto;
            margin-bottom: 20px;
        }

        .reset-card h2 {
            margin: 0 0 10px;
            font-size: 24px;
        }

        .reset-card p.subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 50px;
        }

        /* Form row alignment (Label on left, Input on right) */
        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            text-align: left;
        }

        .form-row label {
            flex: 1;
            font-weight: bold;
            font-size: 14px;
        }

        .form-row input {
            flex: 2;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        .form-row input:focus {
            border-color: #999;
        }

        /* Button styling */
        .btn-send {
            background-color: #fbce60;
            border: none;
            padding: 15px 40px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            width: 300px;
            margin-top: 30px;
            border-radius: 4px;
        }

        .btn-send:hover {
            background-color: #f7b92c;
        }

        /* Footer link */
        .login-link {
            margin-top: 30px;
            font-size: 14px;
        }

        .login-link a {
            color: #5b21b6; /* Purple link color from image */
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="reset-card">
        <!-- Logo -->
        <img src="/images/logo.png" alt="Ukay Ukay">
        
        <h2>Reset your password</h2>
        <p class="subtitle">Enter your new password and confirm it below.</p>

        <!-- Form Fields -->
        <div class="form-row">
            <label>New Password</label>
            <input type="password" placeholder="Enter your new password">
        </div>
        
        <div class="form-row">
            <label>Re-enter New Password</label>
            <input type="password" placeholder="Re-enter your new password">
        </div>

        <!-- NEW: Code Input Field -->
        <div class="form-row">
            <label>Verification Code</label>
            <input type="text" placeholder="Enter code">
        </div>

        <!-- Submit Button -->
        <button class="btn-send">SEND CODE</button>

        <!-- Back to Login -->
        <div class="login-link">
            Remember your password? <a href="login.html">Log in</a>
        </div>
    </div>

</body>
</html>
