<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - Ukay Ukay</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Base Styles */
        body { font-family: 'Inter', sans-serif; margin: 0; padding-top: 110px; background-color: #faf9ee; color: #333; }
        * { box-sizing: border-box; }
        
        .layout-container { max-width: 1200px; margin: 0 auto; display: flex; gap: 40px; padding: 20px; align-items: start; }
        
        /* Left Column: Image Upload Preview */
        .upload-section { flex: 1; background: white; padding: 25px; border-radius: 6px; border: 1px solid #e5e5e5; }
        .upload-box { border: 2px dashed #ccc; border-radius: 6px; height: 300px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #fdfdfd; cursor: pointer; color: #666; margin-bottom: 20px; }
        .upload-box:hover { border-color: #fbce60; background: #fff9e6; }
        .upload-box i { font-size: 40px; margin-bottom: 10px; color: #999; }
        .preview-tags { display: flex; flex-wrap: wrap; gap: 10px; }
        .tag { background: #f5f5f5; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 5px; }

        /* Right Column: Form */
        .form-section { flex: 2; background: white; padding: 40px; border-radius: 6px; border: 1px solid #e5e5e5; }
        .form-section h3 { margin-top: 0; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; font-size: 18px; }
        
        .form-row { display: flex; gap: 20px; margin-bottom: 20px; }
        .form-group { flex: 1; display: flex; flex-direction: column; }
        .form-group label { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
        .form-group input[type="text"], .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-family: 'Inter', sans-serif; font-size: 14px; outline: none; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: #fbce60; }
        
        /* Selection Pills (Categories, Sizes, Condition) */
        .pill-group { display: flex; flex-wrap: wrap; gap: 10px; }
        .pill-label { display: block; position: relative; cursor: pointer; }
        .pill-label input { position: absolute; opacity: 0; cursor: pointer; }
        .pill-text { display: block; padding: 8px 16px; background: #f5f5f5; border: 1px solid #e5e5e5; border-radius: 20px; font-size: 13px; transition: all 0.2s; }
        .pill-label input:checked ~ .pill-text { background: #fbce60; border-color: #f7b92c; font-weight: 600; }

        /* Color Selection */
        .color-group { display: flex; flex-wrap: wrap; gap: 12px; }
        .color-swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #ddd; cursor: pointer; display: inline-block; }
        .color-swatch.active { border: 2px solid #333; transform: scale(1.1); }
        .bg-black { background: #000; } .bg-white { background: #fff; } .bg-red { background: #ff4d4d; } .bg-orange { background: #ffa64d; }
        .bg-yellow { background: #ffd24d; } .bg-green { background: #4dff4d; } .bg-blue { background: #4d4dff; } .bg-purple { background: #b34dff; }
        .bg-pink { background: #ff4da6; } .bg-brown { background: #8b4513; } .bg-gray { background: #808080; }

        /* Action Row */
        /* Action Row */
.action-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee; }
.btn-submit { background: #fbce60; border: none; padding: 12px 40px; font-weight: 700; font-size: 14px; border-radius: 4px; cursor: pointer; }
        .btn-submit:hover { background: #f7b92c; }
    </style>
</head>
<body>

    <header class="navbar" style="background-color: rgba(36, 36, 36, 0.50); backdrop-filter: blur(8px); position: fixed; top: 0; left: 0; width: 100%; height: 90px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; box-sizing: border-box; z-index: 9999;">
        <div class="nav-left" style="display: flex; align-items: center; gap: 30px;">
            <button style="background:none; border:none; color:white; font-size:20px; cursor:pointer;"><i class="fa-solid fa-magnifying-glass"></i></button>
            <img src="/images/logo.png" style="height: 36px; width: auto;" alt="Ukay Ukay">
        </div>
        <div class="nav-right" style="display: flex; align-items: center; gap: 24px;">
            <div class="toggle-container" style="display: flex; background-color: rgba(255,255,255,0.2); padding: 3px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.3); margin-right: 12px;">
                <button class="toggle-btn" style="background-color: #ffffff; color: #000000; border: none; padding: 6px 20px; font-size: 11px; font-weight: 800; border-radius: 20px; cursor: pointer;">BUY</button>
                <button class="toggle-btn" style="background: none; color: rgba(255,255,255,0.7); border: none; padding: 6px 20px; font-size: 11px; font-weight: 800; border-radius: 20px; cursor: pointer;">SELL</button>
            </div>
            <a href="homepage.html" style="color:white; text-decoration:none; font-size:20px; cursor:pointer;"><i class="fa-solid fa-house"></i></a>
            <a href="ordermanagement.html" style="color:white; text-decoration:none; font-size:20px; cursor:pointer;"><i class="fa-regular fa-user"></i></a>
            <a href="shoppingcart.html" style="color:white; text-decoration:none; font-size:20px; cursor:pointer;"><i class="fa-solid fa-bag-shopping"></i></a>
            <span style="color: #000000; font-size: 14px;">Logged in</span>
        </div>
    </header>

    <main class="layout-container">
        <aside class="upload-section">
            <div class="upload-box">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <div>Upload Photo Here</div>
            </div>
            <div class="preview-tags">
                <span class="tag"><i class="fa-solid fa-tag"></i> Baggy Pants</span>
                <span class="tag"><i class="fa-solid fa-peso-sign"></i> 290</span>
                <span class="tag"><i class="fa-solid fa-layer-group"></i> Bottom</span>
                <span class="tag"><i class="fa-solid fa-ruler"></i> L</span>
            </div>
        </aside>

        <section class="form-section">
            
            <h3>Basic Product Information</h3>
            <div class="form-row">
                <div class="form-group" style="flex: 2;">
                    <label>Product Name</label>
                    <input type="text" placeholder="e.g. Vintage Plaid Button Down">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Price (PHP)</label>
                    <input type="text" placeholder="0.00">
                </div>
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
                <label>Brand Name</label>
                <input type="text" placeholder="e.g. Levi's, Unbranded">
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
                <label>Product Description</label>
                <textarea rows="4" placeholder="Describe the item..."></textarea>
            </div>
            <div class="form-group" style="margin-bottom: 40px;">
                <label>Category</label>
                <div class="pill-group">
                    <label class="pill-label"><input type="radio" name="category" checked><span class="pill-text">Tops</span></label>
                    <label class="pill-label"><input type="radio" name="category"><span class="pill-text">Bottoms</span></label>
                    <label class="pill-label"><input type="radio" name="category"><span class="pill-text">Outerwear</span></label>
                    <label class="pill-label"><input type="radio" name="category"><span class="pill-text">Bags</span></label>
                    <label class="pill-label"><input type="radio" name="category"><span class="pill-text">Accessories</span></label>
                </div>
            </div>

            <h3>Product Details</h3>
            <div class="form-group" style="margin-bottom: 20px;">
                <label>Color</label>
                <div class="color-group">
                    <span class="color-swatch bg-black active"></span>
                    <span class="color-swatch bg-white"></span>
                    <span class="color-swatch bg-red"></span>
                    <span class="color-swatch bg-orange"></span>
                    <span class="color-swatch bg-yellow"></span>
                    <span class="color-swatch bg-green"></span>
                    <span class="color-swatch bg-blue"></span>
                    <span class="color-swatch bg-purple"></span>
                    <span class="color-swatch bg-pink"></span>
                    <span class="color-swatch bg-brown"></span>
                    <span class="color-swatch bg-gray"></span>
                </div>
            </div>
            <div class="form-group" style="margin-bottom: 40px;">
                <label>Size</label>
                <div class="pill-group">
                    <label class="pill-label"><input type="radio" name="size"><span class="pill-text">XS</span></label>
                    <label class="pill-label"><input type="radio" name="size"><span class="pill-text">S</span></label>
                    <label class="pill-label"><input type="radio" name="size" checked><span class="pill-text">M</span></label>
                    <label class="pill-label"><input type="radio" name="size"><span class="pill-text">L</span></label>
                    <label class="pill-label"><input type="radio" name="size"><span class="pill-text">XL</span></label>
                </div>
            </div>

            <h3>Condition Section</h3>
            <div class="form-group" style="margin-bottom: 20px;">
                <label>Condition Rating</label>
                <div class="pill-group">
                    <label class="pill-label"><input type="radio" name="condition" checked><span class="pill-text">Like New</span></label>
                    <label class="pill-label"><input type="radio" name="condition"><span class="pill-text">Excellent</span></label>
                    <label class="pill-label"><input type="radio" name="condition"><span class="pill-text">Good</span></label>
                    <label class="pill-label"><input type="radio" name="condition"><span class="pill-text">Fair</span></label>
                </div>
            </div>
            <div class="form-group">
                <label>Flaw Notes</label>
                <textarea rows="2" placeholder="List any stains, tears, or missing buttons..."></textarea>
            </div>

            <div class="action-row">
                <div class="form-group" style="width: 200px;">
                    <label>Status</label>
                    <select>
                        <option>Active / Published</option>
                        <option>Draft</option>
                    </select>
                </div>
                <button class="btn-submit">ADD ITEM</button>
            </div>

        </section>
    </main>

</body>
</html>
