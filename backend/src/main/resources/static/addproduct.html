<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - Ukay Ukay</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/addproduct.css">
    <link rel="stylesheet" href="css/globals.css">
    <style>
        /* Base Styles */
        body { font-family: 'Inter', sans-serif; margin: 0; padding-top: 110px; background-color: #faf9ee; color: #333; }
        * { box-sizing: border-box; }
        
        .layout-container { max-width: 1200px; margin: 0 auto; display: flex; gap: 40px; padding: 20px; align-items: start; }
        
        /* Left Column: Image Upload Preview */
        .upload-section { flex: 1; background: white; padding: 25px; border-radius: 6px; border: 1px solid #e5e5e5; }
        .upload-box { border: 2px dashed #ccc; border-radius: 6px; height: 300px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #fdfdfd; cursor: pointer; color: #666; margin-bottom: 20px; }
        .upload-box:hover { border-color: #fbce60; background: #fff9e6; }
        .upload-box i { font-size: 40px; margin-bottom: 10px; color: #999; }
        .preview-tags { display: flex; flex-wrap: wrap; gap: 10px; }
        .tag { background: #f5f5f5; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 5px; }

        /* Right Column: Form */
        .form-section { flex: 2; background: white; padding: 40px; border-radius: 6px; border: 1px solid #e5e5e5; }
        .form-section h3 { margin-top: 0; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; font-size: 18px; }
        
        .form-row { display: flex; gap: 20px; margin-bottom: 20px; }
        .form-group { flex: 1; display: flex; flex-direction: column; }
        .form-group label { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
        .form-group input[type="text"], .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-family: 'Inter', sans-serif; font-size: 14px; outline: none; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: #fbce60; }
        
        /* Selection Pills (Categories, Sizes, Condition) */
        .pill-group { display: flex; flex-wrap: wrap; gap: 10px; }
        .pill-label { display: block; position: relative; cursor: pointer; }
        .pill-label input { position: absolute; opacity: 0; cursor: pointer; }
        .pill-text { display: block; padding: 8px 16px; background: #f5f5f5; border: 1px solid #e5e5e5; border-radius: 20px; font-size: 13px; transition: all 0.2s; }
        .pill-label input:checked ~ .pill-text { background: #fbce60; border-color: #f7b92c; font-weight: 600; }

        /* Color Selection */
        .color-group { display: flex; flex-wrap: wrap; gap: 12px; }
        .color-swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #ddd; cursor: pointer; display: inline-block; }
        .color-swatch.active { border: 2px solid #333; transform: scale(1.1); }
        .bg-black { background: #000; } .bg-white { background: #fff; } .bg-red { background: #ff4d4d; } .bg-orange { background: #ffa64d; }
        .bg-yellow { background: #ffd24d; } .bg-green { background: #4dff4d; } .bg-blue { background: #4d4dff; } .bg-purple { background: #b34dff; }
        .bg-pink { background: #ff4da6; } .bg-brown { background: #8b4513; } .bg-gray { background: #808080; }

        /* Action Row */
        /* Action Row */
.action-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee; }
.btn-submit { background: #fbce60; border: none; padding: 12px 40px; font-weight: 700; font-size: 14px; border-radius: 4px; cursor: pointer; }
        .btn-submit:hover { background: #f7b92c; }
    </style>
</head>
<body>

    <header class="navbar" style="background-color: rgba(36, 36, 36, 0.50); backdrop-filter: blur(8px); position: fixed; top: 0; left: 0; width: 100%; height: 90px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; box-sizing: border-box; z-index: 9999;">
        <div class="nav-left" style="display: flex; align-items: center; gap: 30px;">
            <button style="background:none; border:none; color:white; font-size:20px; cursor:pointer;"><i class="fa-solid fa-magnifying-glass"></i></button>
            <img src="/images/logo.png" style="height: 36px; width: auto;" alt="Ukay Ukay">
        </div>
        <div class="nav-right" style="display: flex; align-items: center; gap: 24px;">
            <div class="toggle-container" style="display: flex; background-color: rgba(255,255,255,0.2); padding: 3px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.3); margin-right: 12px;">
                <button class="toggle-btn" style="background-color: #ffffff; color: #000000; border: none; padding: 6px 20px; font-size: 11px; font-weight: 800; border-radius: 20px; cursor: pointer;">BUY</button>
                <button class="toggle-btn" style="background: none; color: rgba(255,255,255,0.7); border: none; padding: 6px 20px; font-size: 11px; font-weight: 800; border-radius: 20px; cursor: pointer;">SELL</button>
            </div>
            <a href="homepage.html" style="color:white; text-decoration:none; font-size:20px; cursor:pointer;"><i class="fa-solid fa-house"></i></a>
            <a href="ordermanagement.html" style="color:white; text-decoration:none; font-size:20px; cursor:pointer;"><i class="fa-regular fa-user"></i></a>
            <a href="shoppingcart.html" style="color:white; text-decoration:none; font-size:20px; cursor:pointer;"><i class="fa-solid fa-bag-shopping"></i></a>
            <span style="color: #000000; font-size: 14px;">Logged in</span>
        </div>
    </header>

    <main class="layout-container">
        <aside class="upload-section">
            <input type="file" id="productPhotoInput" accept="image/*" style="display: none;">
            <div class="upload-box">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <div>Upload Photo Here</div>
            </div>
            <div class="preview-tags">
                <span class="tag"><i class="fa-solid fa-tag"></i> Baggy Pants</span>
                <span class="tag"><i class="fa-solid fa-peso-sign"></i> 290</span>
                <span class="tag"><i class="fa-solid fa-layer-group"></i> Bottom</span>
                <span class="tag"><i class="fa-solid fa-ruler"></i> L</span>
            </div>
        </aside>

        <section class="form-section">
            
            <h3>Basic Product Information</h3>
            <div class="form-row">
                <div class="form-group" style="flex: 2;">
                    <label>Product Name</label>
                    <input type="text" id="productNameInput" placeholder="e.g. Vintage Plaid Button Down">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Price (PHP)</label>
                    <input type="text" id="productPriceInput" placeholder="0.00">
                </div>
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
                <label>Brand Name</label>
                <input type="text" id="productBrandInput" placeholder="e.g. Levi's, Unbranded">
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
                <label>Product Description</label>
                <textarea id="productDescriptionInput" rows="4" placeholder="Describe the item..."></textarea>
            </div>
            <div class="form-group" style="margin-bottom: 40px;">
                <label>Category</label>
                <div class="pill-group">
                    <label class="pill-label"><input type="radio" name="category" value="Tops" checked><span class="pill-text">Tops</span></label>
                    <label class="pill-label"><input type="radio" name="category" value="Bottoms"><span class="pill-text">Bottoms</span></label>
                    <label class="pill-label"><input type="radio" name="category" value="Outerwear"><span class="pill-text">Outerwear</span></label>
                    <label class="pill-label"><input type="radio" name="category" value="Bags"><span class="pill-text">Bags</span></label>
                    <label class="pill-label"><input type="radio" name="category" value="Accessories"><span class="pill-text">Accessories</span></label>
                </div>
            </div>

            <h3>Product Details</h3>
            <div class="form-group" style="margin-bottom: 20px;">
                <label>Color</label>
                <div class="color-group" id="productColorGroup">
                    <span class="color-swatch bg-black active" data-color="Black"></span>
                    <span class="color-swatch bg-white" data-color="White"></span>
                    <span class="color-swatch bg-red" data-color="Red"></span>
                    <span class="color-swatch bg-orange" data-color="Orange"></span>
                    <span class="color-swatch bg-yellow" data-color="Yellow"></span>
                    <span class="color-swatch bg-green" data-color="Green"></span>
                    <span class="color-swatch bg-blue" data-color="Blue"></span>
                    <span class="color-swatch bg-purple" data-color="Purple"></span>
                    <span class="color-swatch bg-pink" data-color="Pink"></span>
                    <span class="color-swatch bg-brown" data-color="Brown"></span>
                    <span class="color-swatch bg-gray" data-color="Gray"></span>
                </div>
            </div>
            <div class="form-group" style="margin-bottom: 40px;">
                <label>Size</label>
                <div class="pill-group">
                    <label class="pill-label"><input type="radio" name="size" value="XS"><span class="pill-text">XS</span></label>
                    <label class="pill-label"><input type="radio" name="size" value="S"><span class="pill-text">S</span></label>
                    <label class="pill-label"><input type="radio" name="size" value="M" checked><span class="pill-text">M</span></label>
                    <label class="pill-label"><input type="radio" name="size" value="L"><span class="pill-text">L</span></label>
                    <label class="pill-label"><input type="radio" name="size" value="XL"><span class="pill-text">XL</span></label>
                </div>
            </div>

            <h3>Condition Section</h3>
            <div class="form-group" style="margin-bottom: 20px;">
                <label>Condition Rating</label>
                <div class="pill-group">
                    <label class="pill-label"><input type="radio" name="condition" value="Like New" checked><span class="pill-text">Like New</span></label>
                    <label class="pill-label"><input type="radio" name="condition" value="Excellent"><span class="pill-text">Excellent</span></label>
                    <label class="pill-label"><input type="radio" name="condition" value="Good"><span class="pill-text">Good</span></label>
                    <label class="pill-label"><input type="radio" name="condition" value="Fair"><span class="pill-text">Fair</span></label>
                </div>
            </div>
            <div class="form-group">
                <label>Flaw Notes</label>
                <textarea id="productFlawNotesInput" rows="2" placeholder="List any stains, tears, or missing buttons..."></textarea>
            </div>

            <div class="action-row">
                <div class="form-group" style="width: 200px;">
                    <label>Status</label>
                    <select id="productStatusSelect">
                        <option value="AVAILABLE">Active / Published</option>
                        <option value="DRAFT">Draft</option>
                    </select>
                </div>
                <button type="button" class="btn-submit" id="addProductButton">ADD ITEM</button>
            </div>

        </section>
    </main>

    <script src="js/app.js"></script>
    <script>
        const uploadBox = document.querySelector('.upload-box');
        const productPhotoInput = document.getElementById('productPhotoInput');
        const categoryRadios = document.querySelectorAll('input[name="category"]');
        const sizeRadios = document.querySelectorAll('input[name="size"]');
        const conditionRadios = document.querySelectorAll('input[name="condition"]');
        const colorSwatches = document.querySelectorAll('.color-swatch');
        const addProductButton = document.getElementById('addProductButton');
        let selectedImageData = null;
        let selectedColor = 'Black';

        uploadBox.addEventListener('click', () => {
            productPhotoInput.click();
        });

        productPhotoInput.addEventListener('change', function() {
            const file = this.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                selectedImageData = event.target.result;
                uploadBox.style.backgroundImage = `url(${selectedImageData})`;
                uploadBox.style.backgroundSize = 'cover';
                uploadBox.style.backgroundPosition = 'center';
                uploadBox.style.color = 'transparent';
                uploadBox.style.border = 'none';
                uploadBox.innerHTML = '';
            };
            reader.readAsDataURL(file);
        });

        colorSwatches.forEach(swatch => {
            swatch.addEventListener('click', () => {
                colorSwatches.forEach(s => s.classList.remove('active'));
                swatch.classList.add('active');
                selectedColor = swatch.dataset.color || selectedColor;
            });
        });

        function getCheckedValue(nodes, fallback) {
            const checked = Array.from(nodes).find(node => node.checked);
            return checked ? checked.value : fallback;
        }

        function buildRequestHeaders() {
            const headers = {};
            if (typeof getAuthHeaders === 'function') {
                Object.assign(headers, getAuthHeaders());
            } else {
                const token = sessionStorage.getItem('authToken');
                if (token) headers['Authorization'] = 'Bearer ' + token;
            }
            return headers;
        }

        async function submitProduct() {
            const currentUserId = sessionStorage.getItem('currentUserId');
            if (!currentUserId) {
                alert('Please login before adding a product.');
                window.location.href = 'login.html';
                return;
            }

            const name = document.getElementById('productNameInput').value.trim();
            const priceValue = document.getElementById('productPriceInput').value.trim();
            const brand = document.getElementById('productBrandInput').value.trim();
            const description = document.getElementById('productDescriptionInput').value.trim();
            const flaws = document.getElementById('productFlawNotesInput').value.trim();
            const status = document.getElementById('productStatusSelect').value;

            if (!name || !priceValue) {
                alert('Product name and price are required.');
                return;
            }

            const price = parseFloat(priceValue.replace(/,/g, ''));
            if (Number.isNaN(price) || price < 0) {
                alert('Please enter a valid price.');
                return;
            }

            const category = getCheckedValue(categoryRadios, 'Tops');
            const size = getCheckedValue(sizeRadios, 'M');
            const itemCondition = getCheckedValue(conditionRadios, 'Like New');

            const productBody = {
                itemName: name,
                category,
                price: price,
                stockQuantity: 1,
                description: flaws ? `${description}\nFlaw Notes: ${flaws}` : description,
                imagePath: '/images/default-product.png',
                size,
                itemCondition,
                status,
                style: brand
            };

            const requestUrl = `/api/products/seller/${encodeURIComponent(currentUserId)}`;
            const formData = new FormData();
            formData.append('product', JSON.stringify(productBody));

            const selectedFile = productPhotoInput.files && productPhotoInput.files[0];
            if (selectedFile) {
                formData.append('image', selectedFile);
            }

            const requestOptions = {
                method: 'POST',
                headers: buildRequestHeaders(),
                body: formData
            };

            addProductButton.disabled = true;
            addProductButton.textContent = 'Saving...';

            try {
                const response = await fetch(requestUrl, requestOptions);

                if (!response.ok) {
                    let text = await response.text();
                    try {
                        const json = JSON.parse(text);
                        text = json?.message || json?.error || text;
                    } catch (_) {
                        // not JSON
                    }
                    throw new Error(text || 'Product save failed');
                }

                alert('Product saved successfully.');
                window.location.href = 'inventorymanagement.html';
            } catch (error) {
                console.error('Add product failed', error);
                alert(`Unable to save product: ${error.message}`);
            } finally {
                addProductButton.disabled = false;
                addProductButton.textContent = 'ADD ITEM';
            }
        }

        addProductButton.addEventListener('click', submitProduct);
    </script>

</body>
</html>
