<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Verification Pending</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f7f3e8, #f1f7ec);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #222;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 640px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            padding: 36px;
            text-align: center;
        }
        .icon {
            width: 86px;
            height: 86px;
            border-radius: 50%;
            margin: 0 auto 18px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fbce60;
            color: #111;
            font-size: 34px;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 30px;
        }
        p {
            margin: 8px 0;
            line-height: 1.6;
            color: #4f4f4f;
        }
        .status {
            margin-top: 16px;
            display: inline-block;
            padding: 8px 14px;
            border-radius: 999px;
            background: #fff8e1;
            color: #8a6500;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.02em;
        }
        .actions {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            border: none;
            border-radius: 6px;
            padding: 12px 18px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }
        .btn-primary { background: #1f1f1f; color: #fff; }
        .btn-secondary { background: #eee; color: #222; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon"><i class="fa-solid fa-hourglass-half"></i></div>
        <h1>Application Submitted</h1>
        <p>Your seller registration was submitted successfully.</p>
        <p>Our team is reviewing your profile and uploaded documents.</p>
        <div class="status">STATUS: PENDING APPROVAL</div>
        <div class="actions">
            <button id="checkStatusBtn" class="btn btn-primary" type="button">Check Approval Status</button>
            <a class="btn btn-secondary" href="./index.html">Back to Homepage</a>
        </div>
    </div>

    <script>
        async function fetchSellerRequests(userId, token) {
            if (!userId) return [];
            try {
                const response = await fetch(`/api/seller/requests?userId=${encodeURIComponent(userId)}`, {
                    headers: token ? { 'Authorization': 'Bearer ' + token } : {}
                });
                if (!response.ok) return [];
                const requests = await response.json();
                return Array.isArray(requests) ? requests : [];
            } catch (_) {
                return [];
            }
        }

        function summarizeSellerRequests(requests) {
            const statuses = (Array.isArray(requests) ? requests : [])
                .map((req) => (req?.status || '').toUpperCase())
                .filter(Boolean);
            return {
                hasPendingRequest: statuses.includes('PENDING'),
                hasApprovedRequest: statuses.includes('APPROVED')
            };
        }

        async function ensurePendingRequestExists() {
            const userId = sessionStorage.getItem('currentUserId');
            const token = sessionStorage.getItem('authToken');
            if (!userId) {
                window.location.href = './login.html?next=./sellerpendingapproval.html';
                return;
            }

            const requestSummary = summarizeSellerRequests(await fetchSellerRequests(userId, token));
            if (requestSummary.hasApprovedRequest) {
                window.location.href = './sellerhomeprofile.html';
                return;
            }
            if (!requestSummary.hasPendingRequest) {
                window.location.href = './sellerregistration.html';
            }
        }

        async function checkSellerApprovalStatus() {
            const userId = sessionStorage.getItem('currentUserId');
            const token = sessionStorage.getItem('authToken');
            if (!userId) {
                window.location.href = './login.html?next=./sellerpendingapproval.html';
                return;
            }

            const btn = document.getElementById('checkStatusBtn');
            if (btn) {
                btn.disabled = true;
                btn.textContent = 'Checking...';
            }

            try {
                const response = await fetch(`/api/profile/${encodeURIComponent(userId)}`, {
                    headers: token ? { 'Authorization': 'Bearer ' + token } : {}
                });

                if (!response.ok) {
                    throw new Error('Unable to load seller status.');
                }

                const profile = await response.json();
                const verification = (profile?.verificationStatus || '').toUpperCase();
                const approved = profile?.sellerApproved === true && verification === 'APPROVED';
                sessionStorage.setItem('currentUserSellerApproved', approved ? 'true' : 'false');
                if (verification) {
                    sessionStorage.setItem('currentUserVerificationStatus', verification);
                } else {
                    sessionStorage.removeItem('currentUserVerificationStatus');
                }

                if (approved) {
                    window.location.href = './sellerhomeprofile.html';
                    return;
                }

                const requestSummary = summarizeSellerRequests(await fetchSellerRequests(userId, token));
                if (!requestSummary.hasPendingRequest) {
                    window.location.href = './sellerregistration.html';
                    return;
                }

                alert('Your seller account is still pending approval.');
            } catch (error) {
                alert(error.message || 'Unable to check seller status right now.');
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = 'Check Approval Status';
                }
            }
        }

        ensurePendingRequestExists();
        document.getElementById('checkStatusBtn').addEventListener('click', checkSellerApprovalStatus);
    </script>
</body>
</html>
