<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ukay Shop</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
</head>
<body>
  <h1>Ukay Shop — Demo UI</h1>

  <section id="login-section">
    <h2>Login</h2>
    <form id="loginForm">
      <label>Email<br>
        <input type="email" id="email" required>
      </label>
      <br>
      <label>Password<br>
        <input type="password" id="password" required>
      </label>
      <br>
      <button type="submit">Login</button>
      <div id="loginStatus"></div>
    </form>
  </section>

  <section id="register-section">
    <h2>Register</h2>
    <form id="registerForm">
      <label>Full name<br>
        <input type="text" id="registerName" required>
      </label>
      <br>
      <label>Email<br>
        <input type="email" id="registerEmail" required>
      </label>
      <br>
      <label>Password<br>
        <input type="password" id="registerPassword" required>
      </label>
      <br>
      <label>Account type<br>
        <select id="registerRole">
          <option value="buyer">Buyer</option>
          <option value="seller">Seller</option>
        </select>
      </label>
      <br>
      <button type="submit">Register</button>
      <div id="registerStatus"></div>
    </form>
  </section>

  <section id="seller-section" style="display:none;">
    <h2>Seller — Business Approval Request</h2>
    <form id="sellerRequestForm">
      <label>Business name<br>
        <input type="text" id="bizName" required>
      </label>
      <br>
      <label>Business description<br>
        <textarea id="bizDescription" rows="4" cols="40" required></textarea>
      </label>
      <br>
      <label>Business permit (URL or filename)<br>
        <input type="text" id="bizPermit">
      </label>
      <br>
      <label>Notes<br>
        <textarea id="bizNotes" rows="3" cols="40"></textarea>
      </label>
      <br>
      <button type="submit">Submit Business Request</button>
      <div id="sellerRequestStatus"></div>
    </form>

    <h3>Your Requests</h3>
    <div id="sellerRequests">Not loaded.</div>
  </section>

  <section id="products-section">
    <h2>Products</h2>
    <div id="products">Loading products…</div>
  </section>

  <section id="cart-section">
    <h2>Your Cart</h2>
    <div id="cart">Not logged in.</div>
  </section>

  <section id="orders-section">
    <h2>Your Orders</h2>
    <div id="orders">Not logged in.</div>
  </section>

  <section id="checkout-section">
    <h2>Checkout</h2>
    <form id="checkoutForm">
      <label>Shipping address<br>
        <input type="text" id="shippingAddress" required>
      </label>
      <br>
      <label>Payment method<br>
        <select id="paymentMethod">
          <option>Cash on Delivery</option>
          <option>Card</option>
        </select>
      </label>
      <br>
      <button type="submit">Place Order</button>
    </form>
  </section>

  <script src="js/app.js"></script>
</body>
</html>
