<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <link rel="stylesheet" href="css/Registrationglobal.css">
    <link rel="stylesheet" href="css/REGISTRATION.css">

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >
</head>
<body>

<main class="frame9">
  <section class="frame10">

    <div class="logo-container">
      <img src="images/LOGO.png" alt="Logo" class="form-logo">
    </div>

    <div class="form-body">

      <h2 class="form-title">Create your account</h2>

      <p class="form-subtitle">
        Please fill in the details below to register.
      </p>

      <div class="form-row">
        <label for="fullNameInput">Full Name</label>
        <input
          id="fullNameInput"
          type="text"
          placeholder="Enter your full name"
        />
      </div>

      <div class="form-row">
        <label for="emailInput">Email Address</label>
        <input
          id="emailInput"
          type="email"
          placeholder="Enter your email address"
        />
      </div>

      <div class="form-row">
        <label for="passwordInput">Password</label>
        <input
          id="passwordInput"
          type="password"
          placeholder="Enter your password"
        />
      </div>

      <div class="form-row">
        <label for="confirmPasswordInput">Confirm Password</label>
        <input
          id="confirmPasswordInput"
          type="password"
          placeholder="Confirm your password"
        />
      </div>

      <div class="form-row">
        <label for="contactNoInput">Contact Number</label>
        <input
          id="contactNoInput"
          type="text"
          placeholder="Enter your contact number"
        />
      </div>

      <div class="form-row">
        <label for="addressInput">Address</label>
        <textarea
          id="addressInput"
          placeholder="Enter your complete address"
        ></textarea>
      </div>

      <div class="form-row">
        <label for="accountType">Account Type</label>

        <select id="accountType">
          <option value="">Select account type</option>
          <option value="Regular">Regular User</option>
          <option value="Senior">Senior Citizen</option>
          <option value="PWD">PWD</option>
        </select>
      </div>

      <div
        id="seniorNotice"
        class="senior-notice"
        style="display:none;"
      >
        <div class="notice-icon">👤</div>

        <div>
          If you are registering as a Senior Citizen
          or PWD, please upload a valid Senior Citizen ID
          or PWD ID.
        </div>
      </div>

      <div
        id="idUploadSection"
        class="form-row"
        style="display:none;"
      >
        <label for="idUploadInput">ID Upload</label>

        <input
          id="idUploadInput"
          type="file"
          accept="image/*,.pdf"
        />
      </div>

      <div class="signup-prompt" style="text-align:center; margin-top:24px; font-size:14px;">
        Already have an account? <a href="./login.html">Log in</a>
      </div>

    </div>
  </section>
</main>

<div class="next-container">
  <button type="button" id="registerNextBtn" class="frame-2367variant12">
    NEXT
  </button>
</div>

<script>
const accountType = document.getElementById("accountType");
const idUploadSection = document.getElementById("idUploadSection");
const seniorNotice = document.getElementById("seniorNotice");
const idUploadInput = document.getElementById("idUploadInput");
const registerNextBtn = document.getElementById("registerNextBtn");

accountType.addEventListener("change", () => {
  const value = accountType.value;

  if (value === "Senior" || value === "PWD") {
    idUploadSection.style.display = "grid";
    seniorNotice.style.display = "flex";
  } else {
    idUploadSection.style.display = "none";
    seniorNotice.style.display = "none";
  }
});

registerNextBtn.addEventListener("click", async () => {
  const fullName = document.getElementById("fullNameInput").value.trim();
  const email = document.getElementById("emailInput").value.trim();
  const password = document.getElementById("passwordInput").value;
  const confirmPassword = document.getElementById("confirmPasswordInput").value;
  const contactNo = document.getElementById("contactNoInput").value.trim();
  const accountTypeValue = accountType.value;
  const idNumber = idUploadInput.files.length > 0 ? idUploadInput.files[0].name : null;

  if (!fullName || !email || !password || !confirmPassword || !contactNo) {
    alert("Please complete all required fields before continuing.");
    return;
  }

  if (password !== confirmPassword) {
    alert("Passwords do not match.");
    return;
  }

  const payload = {
    fullName,
    email,
    password,
    contactNo,
    role: "buyer",
    isPwdSenior: accountTypeValue === "Senior" || accountTypeValue === "PWD",
    idNumber: idNumber
  };

  try {
    const response = await fetch("/api/auth/register", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    if (!response.ok) {
      const error = await response.text();
      throw new Error(error || "Registration failed. Please try again.");
    }

    alert("Registration successful. Redirecting to login...");
    window.location.href = "./login.html";
  } catch (err) {
    alert(err.message || "Unable to complete registration.");
  }
});
</script>

</body>
</html>
