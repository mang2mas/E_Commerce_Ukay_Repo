<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - User Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .image-preview { width: 100%; height: 150px; background: #f0f0f0; border-radius: 4px; overflow: hidden; border: 1px solid var(--border-gray); cursor: pointer; }
    .image-preview img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
    .image-preview:hover img { transform: scale(1.05); }
        :root { --bg-cream: #faf9ee; --text-black: #000000; --border-gray: #e5e5e5; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-cream); margin: 0; padding-top: 90px; }
        
        /* Unified Header */
        header { background-color: rgba(36, 36, 36, 0.50); backdrop-filter: blur(8px); position: fixed; top: 0; left: 0; width: 100%; height: 90px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; z-index: 9999; }
        
        .admin-layout { display: flex; max-width: 1400px; margin: 30px auto; gap: 30px; padding: 0 20px; }
        .header-actions { display: flex; gap: 12px; align-items: center; }
        .header-btn { color: white; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.35); border-radius: 999px; padding: 10px 16px; text-decoration: none; font-weight: 700; font-size: 0.9rem; transition: background 0.2s ease; }
        .header-btn:hover { background: rgba(255,255,255,0.22); }

        /* Dashboard Card */
        .card { background: white; border: 1px solid var(--border-gray); border-radius: 8px; padding: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        /* Left Table Side */
        .verification-panel { flex: 2; }
        .filter-tabs { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .tab-btn { background: none; border: none; font-weight: 700; color: #888; cursor: pointer; padding-bottom: 10px; }
        .tab-btn.active { color: #000; border-bottom: 2px solid #000; }
        
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 12px; color: #888; padding: 10px; }
        td { padding: 20px 10px; border-top: 1px solid #eee; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-info img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .badge-pending { background: #fff9e6; color: #d4a32b; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; }

        /* Right Panel */
        .details-panel { flex: 1; position: sticky; top: 120px; height: fit-content; }
        .details-header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .details-header img { width: 70px; height: 70px; border-radius: 50%; }
        .detail-row { margin-bottom: 20px; }
        .detail-row label { display: block; font-size: 11px; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        
        .btn-main { width: 100%; padding: 12px; border: none; border-radius: 4px; font-weight: 700; cursor: pointer; margin-bottom: 10px; }
        .btn-approve { background: #fcd462; }
        .btn-reject { background: #eee; }
    </style>
</head>
<body>

    <header>
        <div style="color: white; font-weight: 800; font-size: 20px;">ADMIN PORTAL</div>
        <div class="header-actions">
            <a href="/adminseller.html" class="header-btn">Seller</a>
            <a href="/adminauditlogs.html" class="header-btn">Audit Log</a>
            <div style="display: flex; align-items: center; gap: 15px; color: white;">
                <i class="fa-solid fa-user-circle"></i> Administrator
                <span id="loginStatus" style="color: #000; background: rgba(255, 255, 255, 0.7); padding: 4px 8px; border-radius: 4px; font-size: 12px;">Logged in</span>
            </div>
        </div>
    </header>

    <div class="admin-layout">
        <!-- Verification List -->
        <section class="card verification-panel">
            <h2>User Verification</h2>
            <div class="filter-tabs">
                <button class="tab-btn active">Pending (5)</button>
                <button class="tab-btn">Approved (67)</button>
                <button class="tab-btn">Rejected (67)</button>
            </div>
            <table>
                <thead><tr><th>User</th><th>Account Name</th><th>Date</th><th>Status</th></tr></thead>
                <tbody>
                    <tr>
                        <td class="user-info"><img src="/images/profile-placeholder.jpg"> <div><b>Jenmarc Ronquillo</b><br><small>jenmarc@email.com</small></div></td>
                        <td>THRIFTTOBUSAN</td>
                        <td>May 28, 2026</td>
                        <td><span class="badge-pending">Pending</span></td>
                    </tr>
                </tbody>
            </table>
        </section>

        <!-- Verification Detail Panel -->
        <aside class="card details-panel">
        <div>
            <b>Jenmarc Ronquillo</b><br>
            <small>THRIFTTOBUSAN</small>
        </div>
    </div>

    <!-- Expandable ID Verification -->
    <div class="detail-row">
        <label>ID Verification (PWD/Senior)</label>

        <div class="image-preview" onclick="openModal()">
            <img src="/images/id_placeholder.jpg" alt="ID Verification">
        </div>
    </div>

    <div class="detail-row">
        <label>Date Submitted</label>
        May 28, 2026
    </div>

    <div class="detail-row">
        <label>Contact Number</label>
        0967 123 4567
    </div>

    <div class="detail-row">
        <label>Address</label>
        123 Sampaguita St, Laguna
    </div>

    <button class="btn-main btn-approve">APPROVE</button>
    <button class="btn-main btn-reject">REJECT</button>
    <button class="btn-main" style="background:none; border:1px solid #ddd;">
        REQUEST MORE INFO
    </button>

</aside>

<!-- FULLSCREEN IMAGE MODAL -->
<div class="modal" id="idModal">
    <span class="close-modal" onclick="closeModal()">&times;</span>
    <img src="/images/id_placeholder.jpg" alt="ID Verification">
</div>

<style>
    /* Image Preview */
    .image-preview {
        width: 100%;
        height: 150px;
        background: #f0f0f0;
        border-radius: 4px;
        overflow: hidden;
        border: 1px solid var(--border-gray);
        cursor: pointer;
    }

    .image-preview img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: 0.3s;
    }

    .image-preview:hover img {
        transform: scale(1.05);
    }

    /* Modal */
    .modal {
        display: none;
        position: fixed;
        z-index: 10000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.9);
        justify-content: center;
        align-items: center;
    }

    .modal img {
        max-width: 90%;
        max-height: 90%;
        border-radius: 10px;
    }

    .close-modal {
        position: absolute;
        top: 20px;
        right: 35px;
        color: white;
        font-size: 45px;
        cursor: pointer;
    }
</style>

<script>
    function openModal() {
        document.getElementById('idModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('idModal').style.display = 'none';
    }

    document.getElementById('idModal').addEventListener('click', function(e) {
        if (e.target === this) {
            closeModal();
        }
    });
</script>
    </div>

</body>
</html>
