<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - User Verification</title>
    <!-- Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --bg-cream: #faf9ee; --text-black: #000000; --border-gray: #e5e5e5; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-cream); margin: 0; padding-top: 110px; }
        
        /* Unified Admin Header */
        header { background-color: rgba(36, 36, 36, 0.50); backdrop-filter: blur(8px); position: fixed; top: 0; left: 0; width: 100%; height: 90px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; z-index: 9999; }
        .header-actions { display: flex; gap: 15px; align-items: center; }
        .header-btn { color: white; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.35); border-radius: 999px; padding: 8px 16px; text-decoration: none; font-weight: 700; font-size: 13px; transition: background 0.2s ease; }
        .header-btn:hover { background: rgba(255,255,255,0.22); }
        
        /* Dashboard Layout */
        .admin-layout { display: flex; max-width: 1400px; margin: 0 auto 30px auto; gap: 30px; padding: 0 20px; }
        .card { background: white; border: 1px solid var(--border-gray); border-radius: 8px; padding: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        /* Left Table Side */
        .verification-panel { flex: 2; }
        .filter-tabs { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .tab-btn { background: none; border: none; font-weight: 700; color: #888; cursor: pointer; padding-bottom: 10px; font-size: 14px; }
        .tab-btn.active { color: #000; border-bottom: 2px solid #000; }
        
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 12px; color: #888; padding: 10px; text-transform: uppercase; }
        td { padding: 20px 10px; border-top: 1px solid #eee; font-size: 14px; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-info img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .badge-pending { background: #fff9e6; color: #d4a32b; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; }

        /* Right Detail Panel */
        .details-panel { flex: 1; position: sticky; top: 130px; height: fit-content; }
        .details-header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .details-header img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; }
        
        .detail-row { margin-bottom: 20px; font-size: 14px; color: #333; }
        .detail-row label { display: block; font-size: 11px; color: #888; text-transform: uppercase; margin-bottom: 6px; font-weight: 600; }
        
        .btn-main { width: 100%; padding: 12px; border: none; border-radius: 4px; font-weight: 700; font-size: 13px; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }
        .btn-approve { background: #fcd462; color: #000; }
        .btn-approve:hover { background: #ebd06e; }
        .btn-reject { background: #eee; color: #333; }
        .btn-reject:hover { background: #e0e0e0; }

        /* Image Preview & Modal */
        .image-preview { width: 100%; height: 160px; background: #f0f0f0; border-radius: 6px; overflow: hidden; border: 1px solid var(--border-gray); cursor: pointer; }
        .image-preview img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
        .image-preview:hover img { transform: scale(1.05); }

        .modal { display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; }
        .modal img { max-width: 90%; max-height: 90%; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .close-modal { position: absolute; top: 25px; right: 40px; color: white; font-size: 40px; cursor: pointer; font-weight: 300; transition: color 0.2s; }
        .close-modal:hover { color: #fcd462; }
    </style>
</head>
<body>

    <!-- Admin Top Navbar -->
    <header>
        <div style="color: white; font-weight: 800; font-size: 20px; letter-spacing: 1px;">ADMIN PORTAL</div>
        <div class="header-actions">
            <a href="adminseller.html" class="header-btn">Seller Verifications</a>
            <a href="/admincustomers.html" class="header-btn">Customers</a>
            <a href="/adminauditlogs.html" class="header-btn">Audit Logs</a>
            <div style="display: flex; align-items: center; gap: 10px; color: white; margin-left: 15px;">
                <i class="fa-solid fa-user-circle" style="font-size: 18px;"></i>
                <span style="font-size: 14px;">Administrator</span>
                <span id="loginStatus" style="color: #000; background: rgba(255, 255, 255, 0.9); padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700;">Logged in</span>
                <button class="header-btn" id="adminLogoutBtn" type="button">Logout</button>
            </div>
        </div>
    </header>

    <div class="admin-layout">
        
        <!-- Verification List (Left) -->
        <section class="card verification-panel">
            <h2 style="margin-bottom: 15px; font-size: 22px;">User Verification</h2>
            <div class="filter-tabs">
                <button class="tab-btn active">Pending (0)</button>
                <button class="tab-btn">Approved (0)</button>
                <button class="tab-btn">Rejected (0)</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Discount Type</th>
                        <th>ID Number</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="userTableBody"></tbody>
            </table>
        </section>

        <!-- Verification Detail Panel (Right) -->
        <aside class="card details-panel">
            
            <div id="userDetailContent">
                <p style="color:#666;">Select a user to view their discount eligibility details.</p>
            </div>

        </aside>
    </div>

    <!-- FULLSCREEN IMAGE MODAL -->
    <div class="modal" id="idModal">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <img src="/images/id_placeholder.jpg" alt="ID Verification">
    </div>

    <!-- JavaScript for Modal -->
    <script>
        const userTableBody = document.getElementById('userTableBody');
        const userDetailContent = document.getElementById('userDetailContent');

        function openModal() {
            document.getElementById('idModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('idModal').style.display = 'none';
        }

        async function loadDiscountUsers() {
            const token = sessionStorage.getItem('authToken');
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers.Authorization = 'Bearer ' + token;

            try {
                const response = await fetch('/api/admin/users/discount-requests', { headers });
                if (!response.ok) throw new Error('Unable to load discount requests');
                const users = await response.json();
                renderUsers(users);
            } catch (error) {
                userTableBody.innerHTML = '<tr><td colspan="4" style="color:#c62828;">' + error.message + '</td></tr>';
            }
        }

        function renderUsers(users) {
            if (!users.length) {
                userTableBody.innerHTML = '<tr><td colspan="4" style="color:#666;">No discount-eligible users found.</td></tr>';
                userDetailContent.innerHTML = '<p style="color:#666;">No user records available.</p>';
                return;
            }

            window.__discountUsers = users;
            updateTabCounts(users);
            setActiveTab(0);
            renderFilteredUsers(0);
        }

        function updateTabCounts(users) {
            const pendingCount = users.filter(u => !u.isDiscountElig).length;
            const approvedCount = users.filter(u => u.isDiscountElig).length;
            const rejectedCount = 0;

            const tabButtons = document.querySelectorAll('.tab-btn');
            if (tabButtons[0]) tabButtons[0].textContent = `Pending (${pendingCount})`;
            if (tabButtons[1]) tabButtons[1].textContent = `Approved (${approvedCount})`;
            if (tabButtons[2]) tabButtons[2].textContent = `Rejected (${rejectedCount})`;
        }

        function setActiveTab(index) {
            const tabButtons = document.querySelectorAll('.tab-btn');
            tabButtons.forEach((button, idx) => {
                button.classList.toggle('active', idx === index);
            });
        }

        function renderFilteredUsers(tabIndex) {
            const users = window.__discountUsers || [];
            let filteredUsers = [];

            if (tabIndex === 0) {
                filteredUsers = users.filter(u => !u.isDiscountElig);
            } else if (tabIndex === 1) {
                filteredUsers = users.filter(u => u.isDiscountElig);
            } else {
                filteredUsers = [];
            }

            if (!filteredUsers.length) {
                userTableBody.innerHTML = '<tr><td colspan="4" style="color:#666;">No records found for this tab.</td></tr>';
                userDetailContent.innerHTML = '<p style="color:#666;">Select a user to view their discount eligibility details.</p>';
                return;
            }

            userTableBody.innerHTML = filteredUsers.map(user => `
                <tr onclick="selectUser(${user.userId})" style="cursor:pointer;">
                    <td class="user-info">
                        <img src="/images/profile-placeholder.jpg" alt="Profile">
                        <div>
                            <b>${user.fullName || 'Unnamed User'}</b><br>
                            <small style="color:#666;">${user.email || 'No email'}</small>
                        </div>
                    </td>
                    <td>${user.discountType || 'NONE'}</td>
                    <td>${user.idNumber || 'Not provided'}</td>
                    <td><span class="badge-pending">${user.isDiscountElig ? 'Eligible' : 'Pending'}</span></td>
                </tr>
            `).join('');

            if (filteredUsers[0]) {
                selectUser(filteredUsers[0].userId);
            }
        }

        function selectUser(userId) {
            const user = window.__discountUsers?.find(item => item.userId === userId);
            if (!user) return;
            userDetailContent.innerHTML = `
                <div class="details-header">
                    <img src="/images/profile-placeholder.jpg" alt="Profile">
                    <div>
                        <b style="font-size: 18px;">${user.fullName || 'Unnamed User'}</b><br>
                        <span style="color:#666; font-size: 13px;">${user.email || 'No email'}</span>
                    </div>
                </div>
                <div class="detail-row"><label>Discount Type</label>${user.discountType || 'NONE'}</div>
                <div class="detail-row"><label>ID Number</label>${user.idNumber || 'Not provided'}</div>
                <div class="detail-row"><label>Contact Number</label>${user.contactNo || 'Not provided'}</div>
                <div class="detail-row"><label>Status</label>${user.isActive === false ? 'Inactive' : 'Active'}</div>
                <div class="detail-row"><label>Eligible for Discount</label>${user.isDiscountElig ? 'Yes' : 'No'}</div>
            `;
        }

        document.getElementById('idModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            window.__discountUsers = [];
            const tabButtons = document.querySelectorAll('.tab-btn');
            tabButtons.forEach((button, index) => {
                button.addEventListener('click', () => {
                    setActiveTab(index);
                    renderFilteredUsers(index);
                });
            });
            const logoutButton = document.getElementById('adminLogoutBtn');
            if (logoutButton) {
                logoutButton.addEventListener('click', function() {
                    sessionStorage.removeItem('authToken');
                    sessionStorage.removeItem('currentUserId');
                    sessionStorage.removeItem('currentUserRole');
                    sessionStorage.removeItem('currentUserEmail');
                    sessionStorage.removeItem('currentUserFullName');
                    sessionStorage.removeItem('pendingRedirect');
                    window.location.href = './index.html';
                });
            }
            loadDiscountUsers();
        });
    </script>

</body>
</html>
