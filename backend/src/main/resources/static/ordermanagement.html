<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Purchases</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; margin: 0; background-color: white; padding-top: 90px; }
        .layout { display: flex; min-height: calc(100vh - 90px); }
        .sidebar { width: 250px; background-color: #faf9ee; padding: 40px 20px; border-right: 1px solid #e5e5e5; box-sizing: border-box; }
        .profile-section { text-align: center; margin-bottom: 40px; }
        .profile-img { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #333; display: flex; justify-content: center; align-items: center; font-size: 40px; margin: 0 auto 15px; background: white; }
        .profile-name { font-weight: 700; font-size: 16px; margin: 0 0 5px; }
        .profile-username { font-size: 12px; color: #666; margin: 0 0 15px; }
        .btn-edit-profile { background: white; border: 1px solid #ccc; padding: 8px 20px; font-size: 12px; font-weight: 600; cursor: pointer; border-radius: 4px; }
        .sidebar-menu { list-style: none; padding: 0; margin: 0; }
        .sidebar-menu li { margin-bottom: 20px; }
        .sidebar-menu a { text-decoration: none; color: #333; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .sidebar-menu a.active { color: #000; }
        .sidebar-menu a:hover { color: #f47a55; }
        .main-content { flex: 1; padding: 40px 50px; background: white; }
        .page-title { font-size: 28px; margin: 0 0 5px; }
        .page-subtitle { font-size: 14px; color: #666; margin: 0 0 30px; }
        .tabs { display: flex; border-bottom: 1px solid #e5e5e5; margin-bottom: 30px; }
        .tab { padding: 15px 30px; font-size: 14px; font-weight: 600; color: #333; cursor: pointer; text-align: center; flex: 1; }
        .tab.active { background-color: #fff9e6; border-bottom: 2px solid #fbce60; }
        .tab:hover { background-color: #faf9ee; }
        .order-card { border: 1px solid #e5e5e5; border-radius: 4px; margin-bottom: 20px; }
        .order-header { display: flex; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid #e5e5e5; font-size: 12px; font-weight: 700; }
        .order-status { color: #f47a55; }
        .order-body { display: flex; padding: 0; }
        .product-details { flex: 1; display: flex; padding: 20px; gap: 20px; border-right: 1px solid #e5e5e5; flex-wrap: wrap; }
        .product-img { width: 100px; height: 100px; object-fit: cover; background: #f5f5f5; }
        .product-info h3 { margin: 0 0 5px; font-size: 14px; }
        .product-info p { font-size: 12px; color: #666; margin: 0 0 5px; }
        .product-price { color: #f47a55; font-weight: 700; margin-top: 15px; }
        .tracking-details { flex: 1.2; padding: 20px; }
        .tracking-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 20px; }
        .tracking-text { font-size: 12px; font-weight: 700; }
        .tracking-number { font-weight: normal; }
        .copy-btn { color: #f47a55; text-decoration: underline; cursor: pointer; margin-left: 10px; }
        .action-buttons { display: flex; gap: 10px; }
        .btn-outline { background: white; border: 1px solid #ccc; padding: 6px 15px; font-size: 12px; cursor: pointer; border-radius: 4px; }
        .btn-outline:hover { background: #f5f5f5; }
        .timeline { display: flex; justify-content: space-between; position: relative; margin-bottom: 20px; }
        .timeline::before { content: ''; position: absolute; top: 15px; left: 10%; right: 10%; height: 2px; background: #e5e5e5; z-index: 1; }
        .timeline-progress { position: absolute; top: 15px; left: 10%; height: 2px; background: #fbce60; z-index: 2; }
        .step { text-align: center; z-index: 3; background: white; width: 25%; }
        .step-icon { width: 30px; height: 30px; border-radius: 50%; background: #e5e5e5; color: white; display: flex; justify-content: center; align-items: center; margin: 0 auto 10px; font-size: 14px; }
        .step.active .step-icon { background: #fbce60; color: black; }
        .step-label { font-size: 10px; font-weight: 700; }
        .status-message { background-color: #faf9ee; padding: 10px 15px; font-size: 12px; border-radius: 4px; }
        .empty-state { text-align: center; padding: 60px 20px; color: #666; }
        .empty-state i { font-size: 48px; margin-bottom: 15px; color: #ccc; }
        .review-btn { background: #fbce60; border: none; padding: 6px 14px; font-size: 12px; font-weight: 700; cursor: pointer; border-radius: 4px; margin-top: 8px; }

        /* Navbar */
        header.navbar { background-color: rgba(36, 36, 36, 0.50); backdrop-filter: blur(8px); position: fixed; top: 0; left: 0; width: 100%; height: 90px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; box-sizing: border-box; z-index: 9999; }
        .nav-icon-btn { background:none; border:none; color:white; font-size:20px; cursor:pointer; }
        .toggle-container { display: flex; background-color: rgba(255,255,255,0.2); padding: 3px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.3); margin-right: 12px; }
        .toggle-btn-nav { background: none; color: rgba(255,255,255,0.7); border: none; padding: 6px 20px; font-size: 11px; font-weight: 800; border-radius: 20px; cursor: pointer; }
        .toggle-btn-nav.active { background-color: #ffffff; color: #000000; }
    </style>
</head>
<body>

    <header class="navbar">
        <div style="display: flex; align-items: center; gap: 30px;">
            <button class="nav-icon-btn" onclick="window.location.href='./index.html'"><i class="fa-solid fa-magnifying-glass"></i></button>
            <img src="/images/logo.png" style="height: 36px; width: auto; cursor:pointer;" alt="Logo" onclick="window.location.href='./index.html'">
        </div>
        <div style="display: flex; align-items: center; gap: 24px;">
            <div class="toggle-container">
                <button class="toggle-btn-nav active" onclick="window.location.href='./index.html'">BUY</button>
                <button class="toggle-btn-nav" onclick="window.location.href='./sellerregistration.html'">SELL</button>
            </div>
            <button class="nav-icon-btn" onclick="window.location.href='./index.html'"><i class="fa-solid fa-house"></i></button>
            <button class="nav-icon-btn" onclick="window.location.href='./ordermanagement.html'"><i class="fa-regular fa-user"></i></button>
            <button class="nav-icon-btn" onclick="window.location.href='./shoppingcart.html'"><i class="fa-solid fa-bag-shopping"></i></button>
            <span id="loginStatus" style="color: #000; font-size: 12px; font-weight: 600; background-color: rgba(255, 255, 255, 0.7); padding: 4px 8px; border-radius: 4px;">Not logged in</span>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <div class="profile-section">
                <div class="profile-img"><i class="fa-solid fa-user"></i></div>
                <h2 class="profile-name" id="sidebarName">Loading...</h2>
                <p class="profile-username" id="sidebarUsername">@user</p>
                <button class="btn-edit-profile" onclick="window.location.href='./customersellerprofile.html'">Edit Profile</button>
            </div>
            <ul class="sidebar-menu">
                <li><a class="active"><i class="fa-solid fa-bag-shopping"></i> My Purchases</a></li>
                <li><a onclick="window.location.href='./shoppingcart.html'"><i class="fa-solid fa-cart-shopping"></i> My Cart</a></li>
                <li><a onclick="window.location.href='./customersellerprofile.html'"><i class="fa-solid fa-user"></i> My Profile</a></li>
                <li><a id="logoutSidebarBtn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <h1 class="page-title">My Purchases</h1>
            <p class="page-subtitle">Track and manage your orders</p>

            <div class="tabs">
                <div class="tab active" data-status="ALL">ALL</div>
                <div class="tab" data-status="PENDING">PENDING</div>
                <div class="tab" data-status="PACKED">PACKED</div>
                <div class="tab" data-status="SHIPPED">SHIPPED</div>
                <div class="tab" data-status="DELIVERED">DELIVERED</div>
            </div>

            <div id="ordersContainer">
                <div class="empty-state"><i class="fa-solid fa-circle-notch fa-spin"></i><p>Loading your orders...</p></div>
            </div>
        </main>
    </div>

    <script src="/js/jquery-3.6.0.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        const userId = sessionStorage.getItem('currentUserId');
        const token = sessionStorage.getItem('authToken');

        if (!userId) {
            window.location.href = './login.html?next=./ordermanagement.html';
        }

        function authHeader() {
            return token ? { 'Authorization': 'Bearer ' + token } : {};
        }

        // Logout
        document.getElementById('logoutSidebarBtn').addEventListener('click', function() {
            sessionStorage.clear();
            window.location.href = './login.html';
        });

        // Update login status display
        const fullName = sessionStorage.getItem('currentUserFullName');
        if (fullName) {
            document.getElementById('loginStatus').textContent = fullName;
            document.getElementById('sidebarName').textContent = fullName;
            document.getElementById('sidebarUsername').textContent = '@' + (sessionStorage.getItem('currentUserEmail') || '').split('@')[0];
        }

        // Load profile from API
        fetch('/api/profile/' + userId, { headers: authHeader() })
            .then(r => r.json())
            .then(user => {
                const name = user.fullName || user.email || 'User';
                document.getElementById('sidebarName').textContent = name;
                document.getElementById('loginStatus').textContent = name;
                const emailPrefix = (user.email || '').split('@')[0];
                document.getElementById('sidebarUsername').textContent = '@' + emailPrefix;
            })
            .catch(() => {});

        // Tab filtering
        let allOrders = [];
        let activeTab = 'ALL';

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                activeTab = this.dataset.status;
                renderOrders(filterOrders(allOrders, activeTab));
            });
        });

        function filterOrders(orders, status) {
            if (status === 'ALL') return orders;
            return orders.filter(o => {
                const s = (o.orderStatus || o.status || '').toUpperCase();
                return s === status;
            });
        }

        function getStatusProgress(status) {
            const s = (status || '').toUpperCase();
            if (s === 'DELIVERED' || s === 'COMPLETED') return { width: '90%', steps: ['PENDING','PACKED','SHIPPED','DELIVERED'] };
            if (s === 'SHIPPED') return { width: '60%', steps: ['PENDING','PACKED','SHIPPED','DELIVERED'] };
            if (s === 'PACKED') return { width: '30%', steps: ['PENDING','PACKED','SHIPPED','DELIVERED'] };
            return { width: '0%', steps: ['PENDING','PACKED','SHIPPED','DELIVERED'] };
        }

        function getStatusMessage(status) {
            const s = (status || '').toUpperCase();
            if (s === 'PENDING') return 'Your seller is preparing your order.';
            if (s === 'PACKED') return 'Your order has been packed and is ready for pickup.';
            if (s === 'SHIPPED') return 'Your order is on its way!';
            if (s === 'DELIVERED' || s === 'COMPLETED') return 'Your order has been delivered. Enjoy!';
            return 'Order status: ' + (status || 'Unknown');
        }

        function renderOrders(orders) {
            const container = document.getElementById('ordersContainer');
            if (!orders || orders.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fa-solid fa-bag-shopping"></i><p>No orders found.</p></div>';
                return;
            }

            container.innerHTML = '';
            orders.forEach(function(order) {
                const orderId = order.orderId || order.id || 'N/A';
                const status = order.orderStatus || order.status || 'PENDING';
                const progress = getStatusProgress(status);
                const activeStepIdx = progress.steps.indexOf(status.toUpperCase());

                const card = document.createElement('div');
                card.className = 'order-card';
                card.innerHTML = `
                    <div class="order-header">
                        <span>Order #${orderId}</span>
                        <span class="order-status">${status}</span>
                    </div>
                    <div class="order-body">
                        <div class="product-details" id="items-${orderId}">
                            <div style="color:#999; font-size:12px;">Loading items...</div>
                        </div>
                        <div class="tracking-details">
                            <div class="tracking-header">
                                <div class="tracking-text">
                                    Tracking Number<br>
                                    <span class="tracking-number" id="track-${orderId}">Loading...</span>
                                    <span class="copy-btn" onclick="copyTracking('track-${orderId}')">Copy</span>
                                </div>
                                <div class="action-buttons">
                                    <button class="btn-outline" onclick="window.location.href='./customersellerprofile.html'">View Shop</button>
                                </div>
                            </div>
                            <div class="timeline">
                                <div class="timeline-progress" style="width:${progress.width}"></div>
                                ${progress.steps.map((step, i) => `
                                    <div class="step ${i <= activeStepIdx ? 'active' : ''}">
                                        <div class="step-icon">${getStepIcon(step)}</div>
                                        <div class="step-label">${step}</div>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="status-message">${getStatusMessage(status)}</div>
                        </div>
                    </div>
                `;
                container.appendChild(card);

                // Load order items
                fetch('/api/orders/' + orderId + '/items', { headers: authHeader() })
                    .then(r => r.json())
                    .then(items => {
                        const itemsDiv = document.getElementById('items-' + orderId);
                        if (!items || items.length === 0) {
                            itemsDiv.innerHTML = '<div style="color:#999; font-size:12px;">No items</div>';
                            return;
                        }
                        itemsDiv.innerHTML = '';
                        items.forEach(function(item) {
                            const product = item.product || {};
                            const imageUrl = product.imagePath || '/images/item1.jpg';
                            const itemDiv = document.createElement('div');
                            itemDiv.style.cssText = 'display:flex;gap:15px;margin-bottom:15px;';
                            itemDiv.innerHTML = `
                                <img src="${imageUrl}" class="product-img" alt="${product.itemName || 'Item'}" onerror="this.src='/images/item1.jpg'">
                                <div class="product-info">
                                    <h3>${product.itemName || 'Product'}</h3>
                                    <p>Size: ${product.size || '—'} · Condition: ${product.itemCondition || '—'}</p>
                                    <p>Qty: ${item.quantity || 1}</p>
                                    <div class="product-price">₱${parseFloat(item.priceAtPurchase || product.price || 0).toFixed(2)}</div>
                                    <button class="review-btn" onclick="window.location.href='./productreview.html?productId=${product.productId || ''}&orderId=${orderId}'">Leave Review</button>
                                </div>
                            `;
                            itemsDiv.appendChild(itemDiv);
                        });
                    })
                    .catch(() => {
                        const itemsDiv = document.getElementById('items-' + orderId);
                        if (itemsDiv) itemsDiv.innerHTML = '<div style="color:#999; font-size:12px;">Could not load items.</div>';
                    });

                // Load shipment info
                fetch('/api/shipments/order/' + orderId, { headers: authHeader() })
                    .then(r => r.json())
                    .then(shipments => {
                        const trackEl = document.getElementById('track-' + orderId);
                        if (trackEl && shipments && shipments.length > 0) {
                            const s = shipments[0];
                            trackEl.textContent = s.trackingNumber || 'Not yet assigned';
                        } else if (trackEl) {
                            trackEl.textContent = 'Not yet assigned';
                        }
                    })
                    .catch(() => {
                        const trackEl = document.getElementById('track-' + orderId);
                        if (trackEl) trackEl.textContent = 'Not available';
                    });
            });
        }

        function getStepIcon(step) {
            if (step === 'PENDING') return '<i class="fa-solid fa-clipboard-list"></i>';
            if (step === 'PACKED') return '<i class="fa-solid fa-box-open"></i>';
            if (step === 'SHIPPED') return '<i class="fa-solid fa-truck"></i>';
            return '<i class="fa-solid fa-check"></i>';
        }

        function copyTracking(elemId) {
            const text = document.getElementById(elemId).textContent;
            navigator.clipboard.writeText(text).then(() => alert('Tracking number copied!')).catch(() => {});
        }

        // Load orders from API
        fetch('/api/orders/customer/' + userId, { headers: authHeader() })
            .then(r => {
                if (!r.ok) throw new Error('Failed to load orders');
                return r.json();
            })
            .then(orders => {
                allOrders = orders || [];
                renderOrders(filterOrders(allOrders, activeTab));
            })
            .catch(() => {
                document.getElementById('ordersContainer').innerHTML =
                    '<div class="empty-state"><i class="fa-solid fa-circle-exclamation"></i><p>Could not load orders. Please try again.</p></div>';
            });
    </script>
</body>
</html>
