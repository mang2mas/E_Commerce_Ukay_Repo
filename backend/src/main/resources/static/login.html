<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ukay Ukay | Log In</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>


    <div class="login-wrapper">
        <div class="logo-container">
            <img src="/images/LOGO.png" alt="Ukay Ukay Logo">
        </div>
       
        <h2><strong>Log in</strong> to continue shopping</h2>
       
        <form id="loginForm">
            <div class="form-group">
                <label for="email">EMAIL / USERNAME</label>
                <input type="text" id="email" placeholder="Enter your email or username" required>
            </div>
            <div class="form-group">
                <label for="password">PASSWORD</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn-login">Log in</button>
            <div id="message" class="message" aria-live="polite"></div>
            <div class="signup-prompt">
                Don’t have an account? <a href="./REGISTRATION.html">Sign up</a>
            </div>
        </form>
    </div>


    <script>
        function normalizeRedirectUrl(url) {
            const trimmed = String(url || '').trim();
            if (!trimmed || trimmed === './' || trimmed === '/' || trimmed === 'index.html' || trimmed === './index.html' || trimmed.endsWith('/index.html') || trimmed === window.location.origin + '/') {
                return './index.html';
            }
            return trimmed;
        }

        function getRoleDefaultRedirect(role) {
            const normalizedRole = String(role || '').trim().toLowerCase();
            return normalizedRole === 'admin' ? './adminuser.html' : './index.html';
        }

        function resolveLoginRedirect(role, redirectUrl) {
            const normalizedRedirect = normalizeRedirectUrl(redirectUrl);
            const isLoginTarget = normalizedRedirect.includes('login.html') || normalizedRedirect === './index.html';
            if (isLoginTarget) {
                return getRoleDefaultRedirect(role);
            }
            return normalizedRedirect;
        }

        const storedRole = sessionStorage.getItem('currentUserRole');
        const defaultRedirect = getRoleDefaultRedirect(storedRole);
        const nextUrl = new URLSearchParams(window.location.search).get('next') || defaultRedirect;

        if (sessionStorage.getItem('authToken')) {
            window.location.href = resolveLoginRedirect(storedRole, nextUrl);
        }


        async function loginUser(email, password) {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password })
            });


            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(errorText || 'Login failed');
            }


            return response.json();
        }


        function showMessage(text, type = 'error') {
            const messageElement = document.getElementById('message');
            messageElement.textContent = text;
            messageElement.className = `message ${type}`;
        }


        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;


            if (!email || !password) {
                showMessage('Email and password are required.');
                return;
            }


            showMessage('Logging in...', 'info');


            try {
                const data = await loginUser(email, password);
                sessionStorage.setItem('authToken', data.token);
                sessionStorage.setItem('currentUserId', data.userId);
                sessionStorage.setItem('currentUserRole', data.role);
                sessionStorage.setItem('currentUserEmail', data.email);
                sessionStorage.setItem('currentUserFullName', data.fullName);

                const finalRedirect = resolveLoginRedirect(data.role, nextUrl);
                window.location.href = finalRedirect;
            } catch (error) {
                showMessage('Login failed: ' + (error.message || 'Invalid credentials'));
            }
        });
    </script>


</body>
</html>
