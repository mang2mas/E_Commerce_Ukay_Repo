<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ukay Ukay | Log In</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

    <div class="login-wrapper">
        <div class="logo-container">
            <img src="/images/LOGO.png" alt="Ukay Ukay Logo">
        </div>
        
        <h2><strong>Log in</strong> to continue shopping</h2>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">EMAIL</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label for="password">PASSWORD</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            
            <a href="#" class="forgot-password-link">Forgot password?</a>
            
            <button type="submit" class="btn-login">LOG IN</button>
        </form>
        
        <div class="divider">OR</div>
        
    <button class="btn-oauth btn-google">
        Continue with Google
    </button>

    <button class="btn-oauth btn-apple">
        Continue with Apple
    </button>
        
        <div class="signup-prompt">
            Don’t have an account? <a href="#">Sign up</a>
        </div>
        
        <div class="admin-wrapper">
            <a href="#" class="admin-link">Admin</a>
        </div>
    </div>

    <script>
        const nextUrl = new URLSearchParams(window.location.search).get('next') || './index.html';

        if (sessionStorage.getItem('currentUserId')) {
            window.location.href = nextUrl;
        }

        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const emailValue = document.getElementById('email').value.trim();
            const loginUserId = emailValue || 'guest-user';

            sessionStorage.setItem('currentUserId', loginUserId);
            sessionStorage.setItem('currentUserRole', 'buyer');

            window.location.href = nextUrl;
        });
    </script>

</body>
</html>
