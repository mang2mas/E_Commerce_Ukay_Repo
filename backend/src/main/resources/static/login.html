<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ukay Ukay | Log In</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

    <div class="login-wrapper">
        <div class="logo-container">
            <img src="/images/LOGO.png" alt="Ukay Ukay Logo">
        </div>
        
        <h2><strong>Log in</strong> to continue shopping</h2>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">EMAIL</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            
            <div style="margin-bottom: 20px; text-align: left;">
    <label style="display: block; font-weight: bold; font-size: 14px; margin-bottom: 5px;">PASSWORD</label>
    <input type="password" placeholder="Enter your password" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; box-sizing: border-box;">
    
    <div style="text-align: right; margin-top: 5px; margin-bottom: 15px;">
        <a href="forgotpassword.html" style="font-size: 12px; color: black; text-decoration: underline; cursor: pointer;">Forgot password?</a>
    </div>
</div>

<button style="width: 100%; background-color: #fbce60; color: #000; border: none; padding: 12px; font-weight: bold; font-size: 14px; cursor: pointer; margin-bottom: 30px;">
    LOG IN
</button>
        
        <div class="signup-prompt">
            Don’t have an account? <a href="./REGISTRATION.html">Sign up</a>
        </div>
        
        <div class="admin-wrapper">
            <a href="./sellerverification.html" id="adminLink" class="admin-link" onclick="window.location.href='./sellerverification.html'; return false;">Admin</a>
        </div>
    </div>

    <script>
        const nextUrl = new URLSearchParams(window.location.search).get('next') || './index.html';

        if (sessionStorage.getItem('currentUserId')) {
            window.location.href = nextUrl;
        }

        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const emailValue = document.getElementById('email').value.trim();
            const loginUserId = emailValue || 'guest-user';

            sessionStorage.setItem('currentUserId', loginUserId);
            sessionStorage.setItem('currentUserRole', 'buyer');

            window.location.href = nextUrl;
        });

        document.getElementById('adminLink').addEventListener('click', function(event) {
            event.preventDefault();
            window.location.href = 'sellerverification.html';
        });
    </script>

</body>
</html>
