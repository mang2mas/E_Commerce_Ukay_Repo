<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave a Review - Ukay Ukay</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #faf9ee; padding-top: 110px; color: #111; }

        header { background: rgba(36,36,36,0.85); backdrop-filter: blur(8px); position: fixed; top: 0; left: 0; width: 100%; height: 90px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; z-index: 9999; }
        .nav-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
        .nav-btn:hover { opacity: 0.8; }

        .review-wrapper { max-width: 640px; margin: 40px auto; padding: 0 20px 80px; }

        .product-preview { display: flex; gap: 16px; align-items: center; background: white; border: 1px solid #e5e5e5; border-radius: 8px; padding: 20px; margin-bottom: 28px; }
        .product-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; border: 1px solid #eee; }
        .product-preview-info h2 { font-size: 18px; margin-bottom: 4px; }
        .product-preview-info p { color: #666; font-size: 14px; }

        .review-card { background: white; border: 1px solid #e5e5e5; border-radius: 8px; padding: 32px; }
        .review-card h3 { font-size: 20px; margin-bottom: 24px; }

        .star-picker { display: flex; gap: 8px; margin-bottom: 24px; }
        .star-picker button { background: none; border: none; font-size: 36px; cursor: pointer; color: #ccc; transition: color 0.15s; line-height: 1; }
        .star-picker button.selected, .star-picker button:hover { color: #fbce60; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 700; font-size: 13px; margin-bottom: 8px; color: #333; }
        .form-group textarea { width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 14px; resize: vertical; min-height: 120px; outline: none; transition: border-color 0.2s; }
        .form-group textarea:focus { border-color: #fbce60; }

        .submit-btn { width: 100%; padding: 14px; background: #fbce60; border: none; border-radius: 6px; font-weight: 700; font-size: 15px; cursor: pointer; transition: background 0.2s; }
        .submit-btn:hover { background: #e8bc4f; }
        .submit-btn:disabled { background: #ddd; color: #999; cursor: not-allowed; }

        #reviewMessage { margin-top: 16px; padding: 12px 16px; border-radius: 6px; font-size: 14px; font-weight: 600; display: none; }
        #reviewMessage.success { background: #e8f5e9; color: #2e7d32; }
        #reviewMessage.error { background: #ffebee; color: #c62828; }
    </style>
</head>
<body>

<header>
    <div style="display:flex; align-items:center; gap:20px;">
        <button class="nav-btn home-trigger"><i class="fa-solid fa-house"></i></button>
        <img src="/images/logo.png" style="height:32px; width:auto;" alt="Ukay Ukay">
    </div>
    <div style="display:flex; align-items:center; gap:20px;">
        <button class="nav-btn profile-trigger"><i class="fa-regular fa-user"></i></button>
        <button class="nav-btn cart-trigger"><i class="fa-solid fa-bag-shopping"></i></button>
    </div>
</header>

<div class="review-wrapper">
    <div class="product-preview">
        <img id="productImg" src="/images/item1.jpg" alt="Product" onerror="this.src='/images/item1.jpg'">
        <div class="product-preview-info">
            <h2 id="productName">Loading product…</h2>
            <p id="productMeta">—</p>
        </div>
    </div>

    <div class="review-card">
        <h3>How was your experience?</h3>

        <div class="star-picker" id="starPicker">
            <button type="button" data-rating="1"><i class="fa-solid fa-star"></i></button>
            <button type="button" data-rating="2"><i class="fa-solid fa-star"></i></button>
            <button type="button" data-rating="3"><i class="fa-solid fa-star"></i></button>
            <button type="button" data-rating="4"><i class="fa-solid fa-star"></i></button>
            <button type="button" data-rating="5"><i class="fa-solid fa-star"></i></button>
        </div>

        <div class="form-group">
            <label for="reviewComment">Your review</label>
            <textarea id="reviewComment" placeholder="Tell us about your experience with this item — quality, fit, shipping speed, etc."></textarea>
        </div>

        <button class="submit-btn" id="submitReviewBtn" onclick="submitReview()">Submit Review</button>
        <div id="reviewMessage"></div>
    </div>
</div>

<script src="/js/jquery-3.6.0.min.js"></script>
<script src="/js/app.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const productId = params.get('productId');
    const orderId = params.get('orderId');
    const userId = sessionStorage.getItem('currentUserId');
    const token = sessionStorage.getItem('authToken');

    if (!userId) window.location.href = './login.html?next=' + encodeURIComponent(window.location.href);

    let selectedRating = 0;

    // Load product info
    if (productId) {
        fetch('/api/products/' + productId)
            .then(r => r.ok ? r.json() : null)
            .then(function(product) {
                if (!product) return;
                document.getElementById('productName').textContent = product.itemName || 'Product';
                document.getElementById('productMeta').textContent = [product.category, product.size, product.itemCondition].filter(Boolean).join(' · ') || '—';
                if (product.imagePath) {
                    const src = product.imagePath.startsWith('/') ? product.imagePath : '/' + product.imagePath;
                    document.getElementById('productImg').src = src;
                }
            })
            .catch(function() {});
    }

    // Star picker logic
    const stars = document.querySelectorAll('#starPicker button');
    stars.forEach(function(btn) {
        btn.addEventListener('click', function() {
            selectedRating = parseInt(this.dataset.rating);
            stars.forEach(function(b, i) {
                b.classList.toggle('selected', i < selectedRating);
            });
        });
        btn.addEventListener('mouseenter', function() {
            const hoverRating = parseInt(this.dataset.rating);
            stars.forEach(function(b, i) {
                b.style.color = i < hoverRating ? '#fbce60' : '';
            });
        });
        btn.addEventListener('mouseleave', function() {
            stars.forEach(function(b, i) {
                b.style.color = '';
                b.classList.toggle('selected', i < selectedRating);
            });
        });
    });

    function showMessage(text, type) {
        const el = document.getElementById('reviewMessage');
        el.textContent = text;
        el.className = type;
        el.style.display = 'block';
    }

    function submitReview() {
        if (selectedRating === 0) { showMessage('Please select a star rating.', 'error'); return; }
        const comment = document.getElementById('reviewComment').value.trim();
        if (!comment) { showMessage('Please write a review comment.', 'error'); return; }
        if (!productId || !userId) { showMessage('Missing product or user information.', 'error'); return; }

        const btn = document.getElementById('submitReviewBtn');
        btn.disabled = true;
        btn.textContent = 'Submitting…';

        const payload = {
            productId: parseInt(productId),
            userId: parseInt(userId),
            rating: selectedRating,
            comment: comment
        };
        if (orderId) payload.orderId = parseInt(orderId);

        fetch('/api/reviews', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...(token ? { 'Authorization': 'Bearer ' + token } : {}) },
            body: JSON.stringify(payload)
        })
        .then(function(r) {
            if (!r.ok) return r.text().then(function(t) { throw new Error(t || 'Submission failed'); });
            return r.json();
        })
        .then(function() {
            showMessage('Review submitted successfully! Thank you.', 'success');
            btn.textContent = 'Review Submitted';
            setTimeout(function() { window.location.href = './ordermanagement.html'; }, 2000);
        })
        .catch(function(err) {
            btn.disabled = false;
            btn.textContent = 'Submit Review';
            showMessage(err.message || 'Could not submit review. Please try again.', 'error');
        });
    }
</script>

</body>
</html>
