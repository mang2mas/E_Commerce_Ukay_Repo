<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Seller Profile - Ukay Ukay</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Seller Profile - Ukay Ukay</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Base Styles */
        body { font-family: 'Inter', sans-serif; margin: 0; padding-top: 110px; background-color: #faf9ee; color: #333; }
        * { box-sizing: border-box; }
        
        /* Profile Layout Container */
        .profile-container { max-width: 1200px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 30px; }
        
        /* Top Banner & Profile Card */
        .profile-header-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 40px; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .profile-image { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 3px solid #fbce60; }
        .profile-info { flex: 1; min-width: 300px; }
        
        .profile-title { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
        .profile-title h1 { margin: 0; font-size: 32px; font-weight: 700; }
        .verified-badge { background: #fff9e6; color: #d4a32b; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        
        .profile-meta { font-size: 14px; color: #666; margin-bottom: 20px; display: flex; gap: 20px; flex-wrap: wrap; }
        .profile-email { display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; padding: 8px 12px; background: #f8f5e8; color: #7a5f00; border-radius: 999px; font-size: 14px; font-weight: 600; width: fit-content; }
        .profile-email a { color: inherit; text-decoration: none; }
        
        /* Stats Row */
        .stats-row { display: flex; gap: 24px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-box { display: flex; flex-direction: column; gap: 5px; }
        .stat-value { font-size: 21px; font-weight: 700; color: #000; display: flex; align-items: center; gap: 8px; }
        .stat-label { font-size: 13px; color: #666; text-transform: uppercase; }
        
        /* Action Buttons */
        .action-buttons { display: flex; gap: 15px; }
        .btn { padding: 12px 30px; font-weight: 700; font-size: 14px; cursor: pointer; border-radius: 4px; transition: all 0.2s; border: none; }
        .btn-follow { background: #fbce60; color: #000; }
        .btn-contact { background: #e5e5e5; color: #000; border: 1px solid #ccc; }
        
        /* Bottom Layout */
        .bottom-layout { display: flex; gap: 30px; align-items: flex-start; flex-wrap: wrap; }
        .left-sidebar { flex: 1; min-width: 320px; display: flex; flex-direction: column; gap: 30px; }
        .info-card { background: white; border: 1px solid #e5e5e5; border-radius: 8px; padding: 30px; }
        .listings-section { flex: 2; background: white; border: 1px solid #e5e5e5; border-radius: 8px; padding: 30px; }
        .seller-products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
        .seller-product-card { background: #fff; border: 1px solid #ececec; border-radius: 8px; overflow: hidden; box-shadow: 0 3px 8px rgba(0,0,0,0.05); }
        .seller-product-card img { width: 100%; height: 220px; object-fit: cover; display: block; }
        .seller-product-info { padding: 12px; }
        .seller-product-title { font-weight: 700; font-size: 14px; margin: 0 0 6px; color: #111; }
        .seller-product-price { color: #d4a32b; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
        .seller-product-details { font-size: 12px; color: #666; line-height: 1.45; margin-bottom: 4px; }
        .seller-product-meta { font-size: 12px; color: #888; }
        .seller-empty-state { color: #666; font-size: 14px; padding: 10px 0; }

        /* MASONRY GRID (Uniform Design) */
        .masonry-grid { display: flex; justify-content: space-between; align-items: stretch; gap: 16px; width: 100%; }
        .masonry-column { display: flex; flex-direction: column; flex: 1; gap: 16px; }
        .masonry-item { position: relative; overflow: hidden; cursor: pointer; width: 100%; }
        .masonry-item img { width: 100%; height: auto; display: block; object-fit: cover; transition: transform 0.4s; }
        .masonry-item:hover img { transform: scale(1.03); }
        .item-hover-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(255, 255, 255, 0.15); opacity: 0; transition: opacity 0.3s; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; z-index: 10; }
        .masonry-item:hover .item-hover-overlay { opacity: 1; }
        .item-title-badge { background: #1a1a1a; color: #fff; font-size: 10px; font-weight: 700; padding: 6px 10px; text-transform: uppercase; }
        .overlay-bottom { display: grid; grid-template-columns: 1fr 1fr; }
        .item-price-tag { background: #1a1a1a; color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
        .btn-add-cart-action { background: #fff; color: #000; border: 1px solid #1a1a1a; font-size: 10px; font-weight: 700; cursor: pointer; }
        .btn-add-cart-action:hover { background: #fbce60; }
    </style>
</head>
<body>

   <header style="background-color: rgba(36, 36, 36, 0.50); backdrop-filter: blur(8px); position: fixed; top: 0; left: 0; width: 100%; height: 90px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; box-sizing: border-box; z-index: 9999;">

    <div style="display: flex; align-items: center; gap: 24px; position: relative; z-index: 10000;">

            <button onclick="window.location.href='./index.html'" style="background-color: #ffffff; color: #000000; border: none; padding: 6px 20px; font-size: 11px; font-weight: 800; border-radius: 20px; cursor: pointer;">BUY</button>

    <style>
        /* Base Styles */
        body { font-family: 'Inter', sans-serif; margin: 0; padding-top: 110px; background-color: #faf9ee; color: #333; }
        * { box-sizing: border-box; }
        
        /* Profile Layout Container */

            background: #fff; 
            border: 1px solid #e5e5e5;

            padding: 40px; 
            display: flex;

        .profile-title { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
        .profile-title h1 { margin: 0; font-size: 32px; font-weight: 700; }
        .verified-badge { background: #fff9e6; color: #d4a32b; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; }

        /* Buttons */
        .action-buttons { display: flex; gap: 15px; }
        .btn { padding: 12px 30px; font-weight: 700; font-size: 14px; cursor: pointer; border-radius: 4px; transition: all 0.2s; border: none; }

        .listings-section h3 { margin-top: 0; font-size: 18px; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        
        /* =========================================
           MASONRY GRID & HOVER OVERLAY CSS
           ========================================= */
        .masonry-grid {
            display: flex;
            justify-content: space-between;
            align-items: stretch; 
            gap: 16px;
            width: 100%;
        }

        .masonry-column {
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between; 
        }

        .masonry-item {
            position: relative; 
            background-color: transparent;
            border: none; 
            margin-bottom: 16px;
            overflow: hidden;
            cursor: pointer;
            width: 100%;
            display: block;
        }

        .masonry-column .masonry-item:last-child {
            margin-bottom: 0;
        }

        .masonry-item img {

            height: auto; 
            display: block;

        .item-hover-overlay {

            left: 0;

            background-color: #ffffff;

            border-radius: 50%;

            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        }

        /* Responsive adjustments */
        @media (max-width: 768px) {

</head>
<body>

    <main class="profile-container">
        <div class="profile-header-card">
            <img id="profileImage" src="/images/profile-placeholder.jpg" alt="Seller profile" class="profile-image">
            
            <div class="profile-info">
                <div class="profile-title">
                    <h1 id="sellerDisplayName">@Seller</h1>
                    <span class="verified-badge"><i class="fa-solid fa-circle-check"></i> Verified Seller</span>
                </div>
                
                <div class="profile-meta">
                    <span id="sellerMeta">Loading seller profile…</span>
                </div>
                
                <div class="stats-row">
                    <div class="stat-box">
                        <span class="stat-value" id="itemsSoldValue"><i class="fa-solid fa-bag-shopping"></i> 0</span>
                        <span class="stat-label">Items Sold</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-value" id="activeListingsValue"><i class="fa-solid fa-tags"></i> 0</span>
                        <span class="stat-label">Active Listings</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-value" id="shippingValue"><i class="fa-solid fa-truck-fast"></i> --</span>
                        <span class="stat-label">Ships Avg</span>
                    </div>
                </div>

                <div id="sellerEmail" class="profile-email"></div>
            </div>
        </div>

        <div class="bottom-layout">
            <div class="left-sidebar">
                <div class="info-card">
                    <h3 id="aboutTitle">About Seller</h3>
                    <p id="aboutDescription">Loading seller information…</p>
                </div>

                <div class="info-card">
                    <h3>Reviews</h3>
                    <div class="rating-summary">
                        <div class="score-big" id="sellerRating">0.0</div>
                        <div>
                            <div class="stars">
                                <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star-half-stroke"></i>
                            </div>
                            <div id="reviewCount" style="font-size: 12px; color: #666; margin-top: 5px;">No reviews yet</div>
                        </div>
                    </div>
                    <p id="reviewSummary">This seller has not received reviews yet.</p>
                </div>
            </div>

            <div class="listings-section">
                <h3 id="activeListingsTitle">Active Listings</h3>
                <div id="sellerProducts" class="seller-products-grid"></div>
            </div>
        </div>
    </main>

    <script src="/js/jquery-3.6.0.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        // Update login status label
        const loginStatusEl = document.getElementById('loginStatus');
        const fullName = sessionStorage.getItem('currentUserFullName');
        if (loginStatusEl && fullName) loginStatusEl.textContent = fullName;

        async function fetchJson(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) return null;
                return await response.json();
            } catch (error) {
                console.error(error);
                return null;
            }
        }

        function formatDisplayName(seller, shop) {
            const baseName = shop?.shopName || seller?.businessName || seller?.fullName || `Seller ${seller?.userId || ''}`;
            const trimmed = String(baseName || '').trim();
            if (!trimmed) return '@seller';
            return trimmed.startsWith('@') ? trimmed : `@${trimmed}`;
        }

        function isActiveProduct(product) {
            const status = product?.status;
            if (!status) return true;
            return ['available', 'active', 'approved'].includes(String(status).toLowerCase());
        }

        function formatPrice(value) {
            if (value == null || value === '') return 'Price not set';
            const number = Number(value);
            if (Number.isNaN(number)) return value;
            return `₱${number.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        function renderProducts(products) {
            const container = document.getElementById('sellerProducts');
            const activeProducts = (products || []).filter(isActiveProduct);

            if (!activeProducts.length) {
                container.innerHTML = '<div class="seller-empty-state">No active listings yet.</div>';
                return;
            }

            container.innerHTML = activeProducts.map((product) => {
                const productId = product?.productId ?? product?.id ?? '';
                const image = product?.imagePath || '/images/profile-placeholder.jpg';
                const title = product?.itemName || product?.productName || product?.name || 'Untitled Item';
                const price = formatPrice(product?.price || product?.productPrice);
                const description = product?.description ? String(product.description).slice(0, 90) : 'No description available.';
                const details = [product?.itemCondition ? `Condition: ${product.itemCondition}` : null, product?.size ? `Size: ${product.size}` : null, product?.category ? `Category: ${product.category}` : null].filter(Boolean).join(' • ');
                return `
                    <div class="seller-product-card masonry-item" data-product-id="${productId}">
                        <img src="${image}" alt="${title}" onerror="this.src='/images/item1.jpg'">
                        <div class="seller-product-info">
                            <p class="seller-product-title item-title-badge">${title}</p>
                            <div class="seller-product-price item-price-tag">${price}</div>
                            <div class="seller-product-details">${description}${description.length >= 90 ? '…' : ''}</div>
                            <div class="seller-product-meta">${details || 'More details coming soon.'}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function loadSellerProfile() {
            const params = new URLSearchParams(window.location.search);
            const sellerId = params.get('sellerId');

            if (!sellerId) {
                document.getElementById('sellerDisplayName').textContent = '@seller';
                document.getElementById('sellerMeta').textContent = 'No seller selected.';
                document.getElementById('aboutDescription').textContent = 'Open this page from an item page to view that seller profile.';
                return;
            }

            const [seller, shop, products] = await Promise.all([
                fetchJson(`/api/profile/${sellerId}`),
                fetchJson(`/api/shops/seller/${sellerId}`).catch(() => null),
                fetchJson(`/api/products/seller/${sellerId}`)
            ]);

            const safeSeller = seller || {};
            const safeShop = shop || {};
            const safeProducts = Array.isArray(products) ? products : [];
            const activeProducts = safeProducts.filter(isActiveProduct);

            const displayName = formatDisplayName(safeSeller, safeShop);
            document.getElementById('sellerDisplayName').textContent = displayName;
            document.getElementById('profileImage').alt = displayName;
            document.getElementById('profileImage').src = safeShop.shopLogoUrl || safeSeller.businessPermitUrl || '/images/profile-placeholder.jpg';
            document.getElementById('sellerMeta').textContent = safeShop.shopName ? `Shop profile • ${safeShop.shopName}` : `Seller profile • ${safeSeller.fullName || safeSeller.businessName || 'Seller'}`;
            document.getElementById('aboutTitle').textContent = `About ${displayName}`;
            document.getElementById('aboutDescription').textContent = safeShop.shopDescription || safeSeller.businessDescription || 'This seller has not added a description yet.';
            document.getElementById('sellerEmail').innerHTML = safeSeller.email ? `<i class="fa-solid fa-envelope"></i><a href="mailto:${safeSeller.email}">${safeSeller.email}</a>` : '';
            document.getElementById('itemsSoldValue').innerHTML = `<i class="fa-solid fa-bag-shopping"></i> ${safeShop.totalSales ?? 0}`;
            document.getElementById('activeListingsValue').innerHTML = `<i class="fa-solid fa-tags"></i> ${activeProducts.length}`;
            document.getElementById('shippingValue').innerHTML = `<i class="fa-solid fa-truck-fast"></i> ${safeShop.responseRate != null ? `${safeShop.responseRate}%` : '--'}`;
            document.getElementById('sellerRating').textContent = safeShop.averageRating != null ? Number(safeShop.averageRating).toFixed(1) : '0.0';
            document.getElementById('reviewCount').textContent = safeShop.totalRatings != null ? `Based on ${safeShop.totalRatings} reviews` : 'No reviews yet';
            document.getElementById('reviewSummary').textContent = safeShop.totalRatings ? 'Customer feedback is available for this seller.' : 'This seller has not received reviews yet.';
            document.getElementById('activeListingsTitle').textContent = `Active Listings (${activeProducts.length})`;

            renderProducts(safeProducts);
        }

        loadSellerProfile();
    </script>

</body>
</html>
