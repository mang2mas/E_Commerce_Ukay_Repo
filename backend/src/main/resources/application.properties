spring.application.name=backend

# 1. Added createDatabaseIfNotExist to ensure the schema auto-creates safely
spring.datasource.url=jdbc:mysql://localhost:3306/group6_ecommerce?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Psychic_Vampire3333
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. CHANGED 'validate' to 'update' so Hibernate dynamically injects your new tables!
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. Add Dialect fallback explicitly to prevent Hibernate from guessing blindly
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect